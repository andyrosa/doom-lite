    // Fast Fourier transform in place. direction is -1 for the forward transform and 1 for the inverse transform,
    // which this function does not scale.
    function transformSpectrum(real, imaginary, direction) {
        const size = real.length;
        for (let index = 1, reversed = 0; index < size; index++) {
            let bit = size >> 1;
            for (; reversed & bit; bit >>= 1) { reversed ^= bit; }
            reversed ^= bit;
            if (index < reversed) {
                const heldReal = real[index];
                real[index] = real[reversed];
                real[reversed] = heldReal;
                const heldImaginary = imaginary[index];
                imaginary[index] = imaginary[reversed];
                imaginary[reversed] = heldImaginary;
            }
        }
        for (let span = 2; span <= size; span <<= 1) {
            const angle = direction * TWO_PI / span;
            for (let start = 0; start < size; start += span) {
                for (let offset = 0; offset < span / 2; offset++) {
                    const cosine = Math.cos(angle * offset);
                    const sine = Math.sin(angle * offset);
                    const evenIndex = start + offset;
                    const oddIndex = evenIndex + span / 2;
                    const oddReal = real[oddIndex] * cosine - imaginary[oddIndex] * sine;
                    const oddImaginary = real[oddIndex] * sine + imaginary[oddIndex] * cosine;
                    real[oddIndex] = real[evenIndex] - oddReal;
                    imaginary[oddIndex] = imaginary[evenIndex] - oddImaginary;
                    real[evenIndex] += oddReal;
                    imaginary[evenIndex] += oddImaginary;
                }
            }
        }
    }

    // Returns the samples of one sound, between -1 and 1, quantized to the 8-bit depth of Doom's sound effects.
    function renderSoundSamples(soundName) {
        const definition = SOUND_DEFINITIONS[soundName];
        if (definition === undefined) { throw new Error('Unknown sound: ' + soundName); }
        const frameCount = definition.pitch.length;
        if (definition.levels.length !== frameCount * SOUND_BAND_COUNT || definition.tone.length !== frameCount * SOUND_TONE_DIGITS) {
            throw new Error('Sound ' + soundName + ' has mismatched pitch, tone, and level tables.');
        }
        const sampleCount = frameCount * SOUND_FRAME_HOP;
        const halfWindow = SOUND_WINDOW / 2;

        // The amplitude that each band should have in each frame.
        const targetAmplitudes = new Float64Array(frameCount * SOUND_BAND_COUNT);
        for (let digitIndex = 0; digitIndex < targetAmplitudes.length; digitIndex++) {
            const digit = parseInt(definition.levels[digitIndex], SOUND_DIGIT_BASE);
            targetAmplitudes[digitIndex] = digit === 0 ? 0 : Math.pow(10, (digit * SOUND_LEVEL_STEP_DECIBELS - SOUND_LEVEL_RANGE_DECIBELS) / 20);
        }

        // The raw source: noise, plus a train of pulses in the frames that have a pitch, or a sine in the frames that
        // have a tone. The buffer starts halfWindow samples before the sound and ends halfWindow samples after it.
        const source = new Float64Array(sampleCount + SOUND_WINDOW);
        let pulsePhase = 0;
        let tonePhase = 0;
        let drift = 0;
        let glidingPitch = 0;
        let glidingTone = 0;
        let softPulse = 0;
        for (let bufferIndex = 0; bufferIndex < source.length; bufferIndex++) {
            const frame = clamp(Math.floor((bufferIndex - halfWindow) / SOUND_FRAME_HOP), 0, frameCount - 1);
            const pitch = parseInt(definition.pitch[frame], SOUND_DIGIT_BASE) * SOUND_PITCH_STEP_HERTZ;
            const tone = parseInt(definition.tone.substr(frame * SOUND_TONE_DIGITS, SOUND_TONE_DIGITS), SOUND_DIGIT_BASE) * SOUND_TONE_STEP_HERTZ;
            const noise = Math.random() * 2 - 1;
            drift += (noise - drift) * 0.02;
            // The pitch and the tone glide from one frame's value to the next instead of jumping.
            glidingPitch = pitch === 0 || glidingPitch === 0 ? pitch : glidingPitch + (pitch - glidingPitch) * SOUND_GLIDE;
            glidingTone = tone === 0 || glidingTone === 0 ? tone : glidingTone + (tone - glidingTone) * SOUND_GLIDE;
            if (glidingTone > 0) {
                tonePhase += glidingTone / SOUND_SAMPLE_RATE;
                source[bufferIndex] = Math.sin(tonePhase * TWO_PI) + noise * SOUND_TONE_NOISE_SHARE;
            } else if (glidingPitch > 0) {
                pulsePhase += glidingPitch * (1 + drift * SOUND_PITCH_JITTER) / SOUND_SAMPLE_RATE;
                let pulse = 0;
                if (pulsePhase >= 1) {
                    pulsePhase -= 1;
                    pulse = Math.sqrt(SOUND_SAMPLE_RATE / glidingPitch);
                }
                // Softening the pulses weakens their high harmonics, so that the top of a voice is breath noise, as in a real voice.
                softPulse += (pulse - softPulse) * SOUND_PULSE_SOFTENING;
                source[bufferIndex] = softPulse + noise * SOUND_VOICE_NOISE_SHARE;
            } else {
                source[bufferIndex] = noise;
            }
        }

        const taper = new Float64Array(SOUND_WINDOW);
        for (let index = 0; index < SOUND_WINDOW; index++) { taper[index] = 0.5 - 0.5 * Math.cos(TWO_PI * index / SOUND_WINDOW); }
        const bandOfBin = new Uint8Array(halfWindow + 1);
        for (let bin = 0; bin <= halfWindow; bin++) {
            const frequency = bin * SOUND_SAMPLE_RATE / SOUND_WINDOW;
            let band = 0;
            while (band < SOUND_BAND_COUNT - 1 && frequency >= SOUND_BAND_EDGES[band + 1]) { band++; }
            bandOfBin[bin] = band;
        }

        // Take overlapping windows of the source, scale each frequency band of each window to its target amplitude,
        // and add the windows back together.
        const shaped = new Float64Array(source.length);
        const real = new Float64Array(SOUND_WINDOW);
        const imaginary = new Float64Array(SOUND_WINDOW);
        const bandEnergy = new Float64Array(SOUND_BAND_COUNT);
        const bandGain = new Float64Array(SOUND_BAND_COUNT);
        for (let center = 0; center <= sampleCount; center += SOUND_SYNTHESIS_HOP) {
            for (let index = 0; index < SOUND_WINDOW; index++) {
                real[index] = source[center + index] * taper[index];
                imaginary[index] = 0;
            }
            transformSpectrum(real, imaginary, -1);
            bandEnergy.fill(0);
            for (let bin = 0; bin <= halfWindow; bin++) { bandEnergy[bandOfBin[bin]] += real[bin] * real[bin] + imaginary[bin] * imaginary[bin]; }
            const framePosition = clamp((center - SOUND_FRAME_HOP / 2) / SOUND_FRAME_HOP, 0, frameCount - 1);
            const earlierFrame = Math.floor(framePosition);
            const laterFrame = Math.min(frameCount - 1, earlierFrame + 1);
            const blend = framePosition - earlierFrame;
            for (let band = 0; band < SOUND_BAND_COUNT; band++) {
                const target = targetAmplitudes[earlierFrame * SOUND_BAND_COUNT + band] * (1 - blend) + targetAmplitudes[laterFrame * SOUND_BAND_COUNT + band] * blend;
                bandGain[band] = bandEnergy[band] > 0 ? target / Math.sqrt(bandEnergy[band]) : 0;
            }
            for (let bin = 0; bin <= halfWindow; bin++) {
                const gain = bandGain[bandOfBin[bin]];
                real[bin] *= gain;
                imaginary[bin] *= gain;
                if (bin > 0 && bin < halfWindow) {
                    real[SOUND_WINDOW - bin] *= gain;
                    imaginary[SOUND_WINDOW - bin] *= gain;
                }
            }
            transformSpectrum(real, imaginary, 1);
            for (let index = 0; index < SOUND_WINDOW; index++) { shaped[center + index] += real[index] * taper[index]; }
        }

        const samples = new Float32Array(sampleCount);
        let peak = 0;
        for (let sampleIndex = 0; sampleIndex < sampleCount; sampleIndex++) { peak = Math.max(peak, Math.abs(shaped[sampleIndex + halfWindow])); }
        if (!(peak > 0)) { throw new Error('Sound ' + soundName + ' is silent or invalid.'); }
        for (let sampleIndex = 0; sampleIndex < sampleCount; sampleIndex++) {
            samples[sampleIndex] = Math.round(shaped[sampleIndex + halfWindow] / peak * SOUND_PEAK * SOUND_SAMPLE_STEPS) / SOUND_SAMPLE_STEPS;
        }
        return samples;
    }

    // ---------------------------------------------------------------- sound playback

    let audioContext = null;
    const soundBuffers = new Map();
    const soundSamples = new Map();

    // Synthesizes one sound that has no samples yet. Returns false when every sound already has its samples.
    function synthesizeNextSound() {
        for (const soundName of Object.keys(SOUND_DEFINITIONS)) {
            if (!soundSamples.has(soundName)) {
                soundSamples.set(soundName, renderSoundSamples(soundName));
                return true;
            }
        }
        return false;
    }

    // Synthesizes the sounds one at a time while the title screen shows, so that the first click starts the game
    // without a pause. A browser allows an AudioContext only after a click or a key press, so only the samples are
    // made here.
    function synthesizeSoundsInBackground() {
        if (synthesizeNextSound()) { setTimeout(synthesizeSoundsInBackground, 0); }
    }

    function startAudio() {
        audioContext = new AudioContext();
        while (synthesizeNextSound()) {
            // The player started before the background synthesis finished, so the remaining sounds are made now.
        }
        for (const [soundName, samples] of soundSamples) {
            const buffer = audioContext.createBuffer(1, samples.length, SOUND_SAMPLE_RATE);
            buffer.getChannelData(0).set(samples);
            soundBuffers.set(soundName, buffer);
        }
    }

    function playSoundWithMix(soundName, volume, pan) {
        const buffer = soundBuffers.get(soundName);
        if (buffer === undefined) { throw new Error('Unknown sound: ' + soundName); }
        if (volume <= 0) { return; }
        const source = audioContext.createBufferSource();
        source.buffer = buffer;
        const gain = audioContext.createGain();
        gain.gain.value = volume;
        const panner = audioContext.createStereoPanner();
        panner.pan.value = pan;
        source.connect(gain);
        gain.connect(panner);
        panner.connect(audioContext.destination);
        source.start();
    }

    function playSound(soundName) {
        playSoundWithMix(soundName, 1, 0);
    }

    function playSoundAt(soundName, sourceX, sourceY) {
        const deltaX = sourceX - player.x;
        const deltaY = sourceY - player.y;
        const distance = Math.hypot(deltaX, deltaY);
        const volume = clamp((SOUND_CLIP_DISTANCE - distance) / (SOUND_CLIP_DISTANCE - SOUND_CLOSE_DISTANCE), 0, 1);
        const rightness = distance === 0 ? 0 : (deltaX * Math.sin(player.angle) - deltaY * Math.cos(player.angle)) / distance;
        playSoundWithMix(soundName, volume, rightness * SOUND_PAN_WIDTH);
    }

    // ---------------------------------------------------------------- level start

    function startLevel() {
        buildLevelGeometry();
        things = [];
        killCount = 0;
        monsterCount = 0;
        levelTic = 0;
        exitTics = 0;
        extraLight = 0;
        message = { text: '', tics: 0 };
        face = { lookIndex: 1, lookTics: 0, ouchTics: 0 };
        weapon = { step: WEAPON_READY, tics: 0, flashTics: 0, refire: false, bobX: 0, bobY: 0 };
        const startSector = sectorAt(PLAYER_START.x, PLAYER_START.y);
        if (startSector === null) { throw new Error('The player start lies outside the level.'); }
        player = {
            x: PLAYER_START.x, y: PLAYER_START.y, z: startSector.floor, angle: PLAYER_START.angleDegrees * Math.PI / 180,
            momentumX: 0, momentumY: 0, momentumZ: 0, radius: PLAYER_RADIUS, height: PLAYER_HEIGHT, maxDropHeight: Infinity,
            sector: startSector, floorZ: startSector.floor, ceilZ: startSector.ceil,
            viewHeight: PLAYER_VIEW_HEIGHT, viewHeightDelta: 0, bob: 0,
            health: START_HEALTH, armor: 0, ammo: START_AMMO, damageCount: 0, bonusCount: 0, dead: false, deadTics: 0
        };
        for (const spawn of THING_SPAWNS) {
            const sector = sectorAt(spawn[1], spawn[2]);
            if (sector === null) { throw new Error('Thing ' + spawn[0] + ' at ' + spawn[1] + ',' + spawn[2] + ' lies outside the level.'); }
            if (spawn[0] in MONSTER_KINDS) {
                things.push({
                    type: 'monster', think: thinkMonster, kindName: spawn[0], kind: MONSTER_KINDS[spawn[0]], x: spawn[1], y: spawn[2], z: sector.floor,
                    angle: spawn[3] * Math.PI / 180, radius: MONSTER_RADIUS, height: MONSTER_HEIGHT, maxDropHeight: MAX_STEP_HEIGHT, solid: true,
                    sector: sector, floorZ: sector.floor, ceilZ: sector.ceil, health: MONSTER_KINDS[spawn[0]].health,
                    sprite: sprites[spawn[0]].walk[0], fullBright: false, mode: 'idle', tics: 1 + (randomByte() % IDLE_LOOK_TICS),
                    walkPhase: 0, moveDirection: NO_DIRECTION, moveCount: 0, reaction: 0, justHit: false, justAttacked: false,
                    sequenceIndex: 0, frameIndex: 0, removed: false
                });
                monsterCount++;
            } else {
                spawnItem(spawn[0], spawn[1], spawn[2], sector, CLIP_AMMO);
            }
        }
    }

    function spawnItem(itemName, itemX, itemY, sector, clipAmount) {
        const itemKind = ITEM_KINDS[itemName];
        if (itemKind === undefined) { throw new Error('Unknown thing kind: ' + itemName); }
        things.push({
            type: 'item', think: thinkItem, itemKind: itemKind, clipAmount: clipAmount, x: itemX, y: itemY, z: sector.floor,
            radius: ITEM_RADIUS, solid: false, sector: sector, frames: sprites[itemName], sprite: sprites[itemName][0], fullBright: false, removed: false
        });
    }

    function spawnEffect(frames, effectX, effectY, effectZ, ticsPerFrame, riseSpeed, fullBright) {
        const sector = sectorAt(effectX, effectY);
        if (sector === null) { return; }
        things.push({
            type: 'effect', think: thinkEffect, x: effectX, y: effectY, z: effectZ, solid: false, sector: sector, sprite: frames[0], fullBright: fullBright,
            frames: frames, frameIndex: 0, ticsPerFrame: ticsPerFrame, tics: ticsPerFrame, riseSpeed: riseSpeed, removed: false
        });
    }

    // ---------------------------------------------------------------- doors, use, and sound propagation

    function activateDoor(sector) {
        const door = sector.door;
        if (door.state === 'closed' || door.state === 'closing') {
            door.state = 'opening';
            playSoundAt('doorOpen', sector.centerX, sector.centerY);
        } else if (door.state === 'waiting') {
            door.state = 'closing';
            playSoundAt('doorClose', sector.centerX, sector.centerY);
        }
    }

    function thingTouchesSector(thing, sector) {
        return sector.lines.some((line) => distanceToLine(thing.x, thing.y, line) < thing.radius);
    }

    function thinkDoors() {
        for (const sector of doorSectors) {
            const door = sector.door;
            if (door.state === 'opening') {
                sector.ceil = Math.min(door.top, sector.ceil + DOOR_SPEED);
                if (sector.ceil === door.top) {
                    door.state = 'waiting';
                    door.timer = DOOR_WAIT_TICS;
                }
            } else if (door.state === 'waiting') {
                door.timer--;
                if (door.timer === 0) { activateDoor(sector); }
            } else if (door.state === 'closing') {
                const obstructed = thingTouchesSector(player, sector) || things.some((thing) => thing.solid && thingTouchesSector(thing, sector));
                if (obstructed) {
                    activateDoor(sector);
                } else {
                    sector.ceil = Math.max(sector.floor, sector.ceil - DOOR_SPEED);
                    if (sector.ceil === sector.floor) { door.state = 'closed'; }
                }
            }
        }
    }

    function useLines() {
        collectHits(player.x, player.y, Math.cos(player.angle), Math.sin(player.angle));
        for (let hitIndex = 0; hitIndex < hitCount && hitParams[hitIndex] <= USE_RANGE; hitIndex++) {
            const line = hitLines[hitIndex];
            const far = hitOnFront[hitIndex] === 1 ? line.back : line.front;
            if (line.exitSwitch) {
                if (exitTics === 0) {
                    line.middle = textures.switchOn;
                    exitTics = EXIT_DELAY_TICS;
                    playSound('switch');
                }
                return;
            }
            if (far === null) {
                playSound('oof');
                return;
            }
            if (far.door !== null) {
                activateDoor(far);
                return;
            }
            if (openingTop(line) <= openingBottom(line)) {
                playSound('oof');
                return;
            }
        }
    }

    // A gunshot wakes every idle monster in a sector that sound reaches through openings from the player's sector.
    function noiseAlert() {
        const reached = new Set([player.sector]);
        const pending = [player.sector];
        while (pending.length > 0) {
            const sector = pending.pop();
            for (const neighbor of sector.neighbors) {
                const line = neighbor.line;
                const open = openingTop(line) > openingBottom(line);
                if (open && !reached.has(neighbor.sector)) {
                    reached.add(neighbor.sector);
                    pending.push(neighbor.sector);
                }
            }
        }
        for (const thing of things) {
            if (thing.type === 'monster' && thing.mode === 'idle' && reached.has(thing.sector)) { wakeMonster(thing); }
        }
    }

    // ---------------------------------------------------------------- combat

    function showMessage(text) {
        message = { text: text, tics: MESSAGE_TICS };
    }

    function rollDamage(dice) {
        return (randomByte() % dice.sides + 1) * dice.multiplier;
    }

    function damagePlayer(amount) {
        if (player.dead) { return; }
        const absorbed = Math.min(player.armor, Math.floor(amount / ARMOR_ABSORB_DIVISOR));
        player.armor -= absorbed;
        const remaining = amount - absorbed;
        player.health = Math.max(0, player.health - remaining);
        player.damageCount = Math.min(MAX_DAMAGE_FLASH, player.damageCount + remaining);
        face.ouchTics = FACE_OUCH_TICS;
        if (player.health === 0) {
            player.dead = true;
            playSound('playerDeath');
        } else {
            playSound('playerPain');
        }
    }

    function enterChase(monster) {
        monster.mode = 'chase';
        monster.tics = monster.kind.chaseTics;
        monster.sprite = sprites[monster.kindName].walk[0];
        monster.fullBright = false;
    }

    function wakeMonster(monster) {
        monster.reaction = MONSTER_REACTION_STEPS;
        enterChase(monster);
        playSoundAt(monster.kind.sightSound, monster.x, monster.y);
    }

    function damageMonster(monster, amount) {
        monster.health -= amount;
        if (monster.health <= 0) {
            monster.mode = 'die';
            monster.solid = false;
            monster.fullBright = false;
            monster.frameIndex = 0;
            monster.sprite = sprites[monster.kindName].die[0];
            monster.tics = DEATH_FRAME_TICS;
            killCount++;
            playSoundAt(monster.kind.deathSound, monster.x, monster.y);
            if (monster.kind.dropsClip) { spawnItem('clip', monster.x, monster.y, monster.sector, DROPPED_CLIP_AMMO); }
            return;
        }
        monster.justHit = true;
        if (randomByte() < monster.kind.painChance) {
            monster.mode = 'pain';
            monster.tics = PAIN_TICS;
            monster.sprite = sprites[monster.kindName].pain;
            monster.fullBright = false;
            playSoundAt('monsterPain', monster.x, monster.y);
        } else if (monster.mode === 'idle') {
            wakeMonster(monster);
        }
    }

    // Fires one bullet. The bullet hits the nearest visible target on the line of fire, or else the first wall.
    function fireBullet(shooter, angle, damage) {
        const originZ = shooter.z + SHOT_HEIGHT;
        const directionX = Math.cos(angle);
        const directionY = Math.sin(angle);
        const targets = shooter === player ? things.filter((thing) => thing.type === 'monster' && thing.solid) : [player];
        let hitTarget = null;
        let hitDistance = SHOT_RANGE;
        for (const target of targets) {
            const relativeX = target.x - shooter.x;
            const relativeY = target.y - shooter.y;
            const along = relativeX * directionX + relativeY * directionY;
            if (along <= 0 || along >= hitDistance) { continue; }
            if (Math.abs(relativeX * directionY - relativeY * directionX) > target.radius) { continue; }
            if (!canSee(shooter.x, shooter.y, originZ, target)) { continue; }
            hitTarget = target;
            hitDistance = along;
        }
        if (hitTarget === player) {
            damagePlayer(damage);
            return;
        }
        if (hitTarget !== null) {
            const bloodDistance = hitDistance - hitTarget.radius;
            spawnEffect(sprites.blood, shooter.x + directionX * bloodDistance, shooter.y + directionY * bloodDistance, hitTarget.z + SHOT_HEIGHT, 6, -1, false);
            damageMonster(hitTarget, damage);
            return;
        }
        collectHits(shooter.x, shooter.y, directionX, directionY);
        for (let hitIndex = 0; hitIndex < hitCount && hitParams[hitIndex] < SHOT_RANGE; hitIndex++) {
            const line = hitLines[hitIndex];
            const stops = line.back === null
                || originZ <= openingBottom(line)
                || originZ >= openingTop(line);
            if (stops) {
                const puffDistance = hitParams[hitIndex] - PUFF_PULLBACK;
                spawnEffect(sprites.puff, shooter.x + directionX * puffDistance, shooter.y + directionY * puffDistance, originZ, 4, 1, false);
                return;
            }
        }
    }

    function firePistol() {
        player.ammo--;
        weapon.flashTics = GUN_FLASH_TICS;
        playSound('pistol');
        noiseAlert();
        const spread = weapon.refire ? (randomByte() - randomByte()) * PISTOL_SPREAD_RADIANS : 0;
        fireBullet(player, player.angle + spread, rollDamage(PISTOL_DAMAGE));
    }

    function thinkWeapon() {
        if (weapon.flashTics > 0) { weapon.flashTics--; }
        extraLight = weapon.flashTics > 0 ? 1 : 0;
        const wantsFire = !player.dead && player.ammo > 0 && (heldKeys.has('ControlLeft') || heldKeys.has('ControlRight'));
        if (weapon.step === WEAPON_READY) {
            const bobTurn = TWO_PI * levelTic / WEAPON_BOB_PERIOD_TICS;
            weapon.bobX = player.bob * Math.cos(bobTurn);
            weapon.bobY = player.bob * Math.abs(Math.sin(bobTurn));
            if (!wantsFire) { return; }
            weapon.step = 0;
            weapon.refire = false;
            weapon.tics = PISTOL_SEQUENCE[0].tics;
            return;
        }
        weapon.tics--;
        if (weapon.tics > 0) { return; }
        weapon.step++;
        if (weapon.step === PISTOL_SEQUENCE.length) {
            if (!wantsFire) {
                weapon.step = WEAPON_READY;
                return;
            }
            weapon.step = 0;
            weapon.refire = true;
        }
        weapon.tics = PISTOL_SEQUENCE[weapon.step].tics;
        if (PISTOL_SEQUENCE[weapon.step].fire) { firePistol(); }
    }

    // ---------------------------------------------------------------- monsters

    function monsterSeesPlayer(monster) {
        if (player.dead || !canSee(monster.x, monster.y, monster.z + MONSTER_EYE_HEIGHT, player)) { return false; }
        const deltaX = player.x - monster.x;
        const deltaY = player.y - monster.y;
        if (Math.hypot(deltaX, deltaY) <= MELEE_RANGE) { return true; }
        return Math.abs(normalizeAngle(Math.atan2(deltaY, deltaX) - monster.angle)) <= Math.PI / 2;
    }

    function monsterMove(monster) {
        if (monster.moveDirection === NO_DIRECTION) { return false; }
        const vector = DIRECTION_VECTORS[monster.moveDirection];
        const result = tryMove(monster, monster.x + vector[0] * MONSTER_SPEED, monster.y + vector[1] * MONSTER_SPEED);
        if (result.blocked) {
            const line = result.blockingLine;
            if (line !== null && line.back !== null) {
                for (const sector of [line.front, line.back]) {
                    if (sector.door !== null && sector.door.state === 'closed') { activateDoor(sector); }
                }
            }
            return false;
        }
        monster.z = monster.floorZ;
        return true;
    }

    function chooseDirection(monster) {
        const deltaX = player.x - monster.x;
        const deltaY = player.y - monster.y;
        const horizontal = deltaX > CHASE_AXIS_THRESHOLD ? DIRECTION_EAST : deltaX < -CHASE_AXIS_THRESHOLD ? DIRECTION_WEST : NO_DIRECTION;
        const vertical = deltaY > CHASE_AXIS_THRESHOLD ? DIRECTION_NORTH : deltaY < -CHASE_AXIS_THRESHOLD ? DIRECTION_SOUTH : NO_DIRECTION;
        const previous = monster.moveDirection;
        const opposite = previous === NO_DIRECTION ? NO_DIRECTION : (previous + 4) % 8;
        const candidates = [];
        if (horizontal !== NO_DIRECTION && vertical !== NO_DIRECTION) {
            candidates.push(horizontal === DIRECTION_EAST ? (vertical === DIRECTION_NORTH ? 1 : 7) : (vertical === DIRECTION_NORTH ? 3 : 5));
        }
        if (Math.abs(deltaY) > Math.abs(deltaX) || randomByte() > 200) {
            candidates.push(vertical, horizontal);
        } else {
            candidates.push(horizontal, vertical);
        }
        candidates.push(previous);
        const firstScan = randomByte() & 7;
        for (let scanOffset = 0; scanOffset < 8; scanOffset++) { candidates.push((firstScan + scanOffset) % 8); }
        candidates.push(opposite);
        for (let candidateIndex = 0; candidateIndex < candidates.length; candidateIndex++) {
            const candidate = candidates[candidateIndex];
            const isLastResort = candidateIndex === candidates.length - 1;
            if (candidate === NO_DIRECTION || (candidate === opposite && !isLastResort)) { continue; }
            monster.moveDirection = candidate;
            if (monsterMove(monster)) {
                monster.moveCount = randomByte() & 15;
                return;
            }
        }
        monster.moveDirection = NO_DIRECTION;
    }

    function applyAttackStep(monster) {
        const step = monster.kind.attackSequence[monster.sequenceIndex];
        monster.sprite = sprites[monster.kindName][step.frame];
        monster.tics = step.tics;
        monster.fullBright = step.frame === 'fire';
        const angleToPlayer = Math.atan2(player.y - monster.y, player.x - monster.x);
        monster.angle = angleToPlayer;
        if (step.action === 'shoot') {
            playSoundAt('pistol', monster.x, monster.y);
            fireBullet(monster, angleToPlayer + (randomByte() - randomByte()) * ZOMBIE_SPREAD_RADIANS, rollDamage(ZOMBIE_SHOT_DAMAGE));
        } else if (step.action === 'impAttack') {
            const distance = Math.hypot(player.x - monster.x, player.y - monster.y);
            if (distance < MELEE_RANGE + PLAYER_RADIUS) {
                playSoundAt('claw', monster.x, monster.y);
                damagePlayer(rollDamage(IMP_DAMAGE));
            } else {
                playSoundAt('fireballLaunch', monster.x, monster.y);
                const travelTics = Math.max(1, distance / FIREBALL_SPEED);
                things.push({
                    type: 'missile', think: thinkMissile, x: monster.x, y: monster.y, z: monster.z + SHOT_HEIGHT, solid: false, sector: monster.sector,
                    velocityX: Math.cos(angleToPlayer) * FIREBALL_SPEED, velocityY: Math.sin(angleToPlayer) * FIREBALL_SPEED,
                    velocityZ: (player.z - monster.z) / travelTics,
                    sprite: sprites.fireball[0], fullBright: true, removed: false
                });
            }
        } else if (step.action !== 'none') {
            throw new Error('Unknown monster action: ' + step.action);
        }
    }

    function chaseStep(monster) {
        if (monster.reaction > 0) { monster.reaction--; }
        if (monster.justAttacked) {
            monster.justAttacked = false;
            chooseDirection(monster);
            return;
        }
        if (!player.dead) {
            const distance = Math.hypot(player.x - monster.x, player.y - monster.y);
            const visible = canSee(monster.x, monster.y, monster.z + MONSTER_EYE_HEIGHT, player);
            let attacks = monster.kind.melee && visible && distance < MELEE_RANGE + PLAYER_RADIUS;
            if (!attacks && visible && monster.moveCount === 0) {
                if (monster.justHit) {
                    monster.justHit = false;
                    attacks = true;
                } else if (monster.reaction === 0) {
                    const threshold = Math.min(200, distance - 64 - (monster.kind.melee ? 0 : 128));
                    attacks = randomByte() >= threshold;
                }
            }
            if (attacks) {
                monster.mode = 'attack';
                monster.sequenceIndex = 0;
                applyAttackStep(monster);
                return;
            }
        }
        monster.moveCount--;
        if (monster.moveCount < 0 || !monsterMove(monster)) { chooseDirection(monster); }
    }

    function thinkMonster(monster) {
        if (monster.mode === 'dead') { return; }
        monster.tics--;
        if (monster.tics > 0) { return; }
        const monsterSprites = sprites[monster.kindName];
        if (monster.mode === 'idle') {
            monster.tics = IDLE_LOOK_TICS;
            if (monsterSeesPlayer(monster)) { wakeMonster(monster); }
        } else if (monster.mode === 'chase') {
            monster.tics = monster.kind.chaseTics;
            monster.walkPhase = (monster.walkPhase + 1) % 4;
            monster.sprite = monsterSprites.walk[monster.walkPhase >> 1];
            chaseStep(monster);
        } else if (monster.mode === 'attack') {
            monster.sequenceIndex++;
            if (monster.sequenceIndex < monster.kind.attackSequence.length) {
                applyAttackStep(monster);
            } else {
                monster.justAttacked = true;
                enterChase(monster);
            }
        } else if (monster.mode === 'pain') {
            enterChase(monster);
        } else if (monster.mode === 'die') {
            monster.frameIndex++;
            if (monster.frameIndex < monsterSprites.die.length) {
                monster.sprite = monsterSprites.die[monster.frameIndex];
                monster.tics = DEATH_FRAME_TICS;
            } else {
                monster.mode = 'dead';
            }
        } else {
            throw new Error('Unknown monster mode: ' + monster.mode);
        }
    }

    function explodeMissile(missile) {
        playSoundAt('fireballExplode', missile.x, missile.y);
        missile.removed = true;
        spawnEffect(sprites.explosion, missile.x, missile.y, missile.z - 8, 6, 0, true);
    }

    function thinkMissile(missile) {
        const nextX = missile.x + missile.velocityX;
        const nextY = missile.y + missile.velocityY;
        const nextZ = missile.z + missile.velocityZ;
        const hitsWall = someCrossedLine(missile.x, missile.y, nextX, nextY, (line) => line.back === null
            || nextZ < openingBottom(line)
            || nextZ + FIREBALL_HEIGHT > openingTop(line));
        const nextSector = hitsWall ? null : sectorAt(nextX, nextY);
        if (nextSector === null || nextZ < nextSector.floor || nextZ + FIREBALL_HEIGHT > nextSector.ceil) {
            explodeMissile(missile);
            return;
        }
        missile.x = nextX;
        missile.y = nextY;
        missile.z = nextZ;
        missile.sector = nextSector;
        missile.sprite = sprites.fireball[(levelTic >> 2) & 1];
        const reach = PLAYER_RADIUS + FIREBALL_RADIUS;
        if (!player.dead && Math.abs(nextX - player.x) < reach && Math.abs(nextY - player.y) < reach
            && nextZ + FIREBALL_HEIGHT > player.z && nextZ < player.z + PLAYER_HEIGHT) {
            damagePlayer(rollDamage(IMP_DAMAGE));
            explodeMissile(missile);
        }
    }

    function thinkEffect(effect) {
        effect.z += effect.riseSpeed;
        effect.tics--;
        if (effect.tics > 0) { return; }
        effect.frameIndex++;
        if (effect.frameIndex === effect.frames.length) {
            effect.removed = true;
            return;
        }
        effect.sprite = effect.frames[effect.frameIndex];
        effect.tics = effect.ticsPerFrame;
    }

    function touchItem(item) {
        const reach = PLAYER_RADIUS + item.radius;
        if (Math.abs(item.x - player.x) >= reach || Math.abs(item.y - player.y) >= reach) { return; }
        if (item.z > player.z + PLAYER_HEIGHT || item.z < player.z - MAX_STEP_HEIGHT) { return; }
        if (!item.itemKind.pickUp(item)) { return; }
        item.removed = true;
        player.bonusCount += BONUS_FLASH_TICS;
        showMessage(item.itemKind.message);
        playSound('pickup');
    }

    function thinkItem(item) {
        item.sprite = item.frames[Math.floor(levelTic / ITEM_FRAME_TICS) % item.frames.length];
        if (!player.dead) { touchItem(item); }
    }

    function thinkThings() {
        const thingCount = things.length;
        for (let thingIndex = 0; thingIndex < thingCount; thingIndex++) {
            const thing = things[thingIndex];
            thing.think(thing);
        }
        things = things.filter((thing) => !thing.removed);
    }

    // ---------------------------------------------------------------- player

    function thinkPlayer(useRequested) {
        const onGround = player.z <= player.floorZ;
        if (player.dead) {
            player.deadTics++;
            if (player.viewHeight > DEAD_VIEW_HEIGHT) { player.viewHeight--; }
        } else {
            const running = heldKeys.has('ShiftLeft') || heldKeys.has('ShiftRight');
            const strafing = heldKeys.has('AltLeft') || heldKeys.has('AltRight');
            const leftHeld = heldKeys.has('ArrowLeft');
            const rightHeld = heldKeys.has('ArrowRight');
            let forwardMove = 0;
            let sideMove = 0;
            const forwardSpeed = running ? RUN_FORWARD_MOVE : WALK_FORWARD_MOVE;
            if (heldKeys.has('ArrowUp')) { forwardMove += forwardSpeed; }
            if (heldKeys.has('ArrowDown')) { forwardMove -= forwardSpeed; }
            const sideSpeed = running ? RUN_SIDE_MOVE : WALK_SIDE_MOVE;
            if (heldKeys.has('Period') || (strafing && rightHeld)) { sideMove += sideSpeed; }
            if (heldKeys.has('Comma') || (strafing && leftHeld)) { sideMove -= sideSpeed; }
            if (!strafing && leftHeld !== rightHeld) {
                turnHeldTics++;
                const turnSpeed = turnHeldTics < SLOW_TURN_TICS ? SLOW_TURN_RADIANS : running ? RUN_TURN_RADIANS : WALK_TURN_RADIANS;
                player.angle = normalizeAngle(player.angle + (leftHeld ? turnSpeed : -turnSpeed));
            } else {
                turnHeldTics = 0;
            }
            if (onGround) {
                const cosine = Math.cos(player.angle);
                const sine = Math.sin(player.angle);
                player.momentumX += (cosine * forwardMove + sine * sideMove) / THRUST_DIVISOR;
                player.momentumY += (sine * forwardMove - cosine * sideMove) / THRUST_DIVISOR;
            }
            if (useRequested) { useLines(); }
        }

        if (player.momentumX !== 0 || player.momentumY !== 0) { slideMove(player); }
        if (onGround) {
            player.momentumX *= FRICTION;
            player.momentumY *= FRICTION;
            if (Math.abs(player.momentumX) < STOP_SPEED && Math.abs(player.momentumY) < STOP_SPEED) {
                player.momentumX = 0;
                player.momentumY = 0;
            }
        }
        // A door that moves above the player changes the ceiling without a move, so the heights are read again every tic.
        const standing = checkPosition(player, player.x, player.y);
        if (standing.sector !== null) {
            player.sector = standing.sector;
            player.floorZ = standing.floorZ;
            player.ceilZ = standing.ceilZ;
        }
        if (player.z < player.floorZ) {
            player.viewHeight -= player.floorZ - player.z;
            player.viewHeightDelta = (PLAYER_VIEW_HEIGHT - player.viewHeight) / 8;
            player.z = player.floorZ;
            player.momentumZ = 0;
        } else if (player.z > player.floorZ) {
            player.momentumZ -= GRAVITY;
            player.z += player.momentumZ;
            if (player.z <= player.floorZ) {
                if (player.momentumZ < -8) {
                    player.viewHeightDelta = player.momentumZ / 8;
                    playSound('oof');
                }
                player.z = player.floorZ;
                player.momentumZ = 0;
            }
        }
        if (!player.dead) {
            player.viewHeight += player.viewHeightDelta;
            if (player.viewHeight >= PLAYER_VIEW_HEIGHT) {
                player.viewHeight = PLAYER_VIEW_HEIGHT;
                player.viewHeightDelta = 0;
            } else {
                if (player.viewHeight < PLAYER_VIEW_HEIGHT / 2) { player.viewHeight = PLAYER_VIEW_HEIGHT / 2; }
                player.viewHeightDelta = Math.max(player.viewHeightDelta, 0) + 0.25;
            }
            if (player.sector.damage && player.z <= player.sector.floor && (levelTic & NUKAGE_DAMAGE_INTERVAL_MASK) === 0) {
                damagePlayer(NUKAGE_DAMAGE);
            }
        }
        player.bob = player.dead ? 0 : Math.min(MAX_BOB, (player.momentumX * player.momentumX + player.momentumY * player.momentumY) / 4);
        if (player.damageCount > 0) { player.damageCount--; }
        if (player.bonusCount > 0) { player.bonusCount--; }
    }

    function thinkSectors() {
        textures.nukage.pixels = textures.nukage.frames[Math.floor(levelTic / NUKAGE_FRAME_TICS) % textures.nukage.frames.length].pixels;
        for (const sector of sectors) {
            if (sector.flicker && (levelTic & 3) === 0) {
                sector.light = randomByte() < 40 ? sector.baseLight - 48 : sector.baseLight;
            }
        }
        if (face.ouchTics > 0) { face.ouchTics--; }
        face.lookTics--;
        if (face.lookTics <= 0) {
            face.lookTics = FACE_LOOK_TICS;
            face.lookIndex = randomByte() % 3;
        }
        if (message.tics > 0) { message.tics--; }
    }

    // ---------------------------------------------------------------- rendering

    function startMapFor(light, contrast) {
        const lightNumber = clamp((light >> 4) + extraLight + contrast, 0, LIGHT_NUMBER_COUNT - 1);
        return (LIGHT_NUMBER_COUNT - 1 - lightNumber) * 4;
    }

    function shadeLevelFor(startMap, depth) {
        let adjustment = (LIGHT_DISTANCE_FACTOR / depth) | 0;
        if (adjustment > MAX_LIGHT_ADJUSTMENT) { adjustment = MAX_LIGHT_ADJUSTMENT; }
        return clamp(startMap - adjustment, 0, SHADE_LEVEL_COUNT - 1);
    }

    // Returns the first screen row whose center lies below the projected height, limited to the open rows of the column.
    function boundaryRow(projectedRow, low, high) {
        return clamp(Math.ceil(projectedRow - 0.5), low, high);
    }

    function drawWallSpan(column, rowStart, rowEnd, texture, textureU, anchorZ, depth, startMap) {
        if (rowStart >= rowEnd) { return; }
        const shadeOffset = shadeLevelFor(startMap, depth) * PALETTE_SIZE;
        const step = depth / PROJECTION_DISTANCE;
        const texturePixels = texture.pixels;
        const textureWidth = texture.width;
        const textureHeight = texture.height;
        const textureColumn = (textureU | 0) & (textureWidth - 1);
        let textureV = anchorZ - viewZ - (VIEW_CENTER_ROW - (rowStart + 0.5)) * step + textureHeight * TEXTURE_V_BIAS_REPEATS;
        let pixelIndex = rowStart * SCREEN_WIDTH + column;
        for (let row = rowStart; row < rowEnd; row++) {
            framePixels[pixelIndex] = shadedColors[shadeOffset + texturePixels[((textureV | 0) % textureHeight) * textureWidth + textureColumn]];
            depthBuffer[pixelIndex] = depth;
            pixelIndex += SCREEN_WIDTH;
            textureV += step;
        }
    }

    function drawFlatSpan(column, rowStart, rowEnd, flat, planeZ, startMap, rayX, rayY) {
        const planeDistance = Math.abs(planeZ - viewZ) * PROJECTION_DISTANCE;
        const flatPixels = flat.pixels;
        let pixelIndex = rowStart * SCREEN_WIDTH + column;
        for (let row = rowStart; row < rowEnd; row++) {
            const distance = planeDistance / Math.abs(VIEW_CENTER_ROW - (row + 0.5));
            const worldX = viewX + rayX * distance;
            const worldY = viewY + rayY * distance;
            const texel = flatPixels[((-worldY & FLAT_MASK) << FLAT_SHIFT) | (worldX & FLAT_MASK)];
            framePixels[pixelIndex] = shadedColors[shadeLevelFor(startMap, distance) * PALETTE_SIZE + texel];
            depthBuffer[pixelIndex] = distance;
            pixelIndex += SCREEN_WIDTH;
        }
    }

    function drawSkySpan(column, rowStart, rowEnd, skyColumn) {
        const skyPixels = textures.sky.pixels;
        let pixelIndex = rowStart * SCREEN_WIDTH + column;
        for (let row = rowStart; row < rowEnd; row++) {
            framePixels[pixelIndex] = shadedColors[skyPixels[Math.min(SKY_HEIGHT - 1, row + SKY_ROW_OFFSET) * SKY_WIDTH + skyColumn]];
            depthBuffer[pixelIndex] = Infinity;
            pixelIndex += SCREEN_WIDTH;
        }
    }

    // Draws the walls, floors, and ceilings. Each screen column casts one ray and walks the lines that the ray crosses, nearest first.
    function renderWorld(forwardX, forwardY) {
        const rightX = forwardY;
        const rightY = -forwardX;
        for (let column = 0; column < SCREEN_WIDTH; column++) {
            const offset = (column + 0.5 - HALF_SCREEN_WIDTH) / PROJECTION_DISTANCE;
            const rayX = forwardX + rightX * offset;
            const rayY = forwardY + rightY * offset;
            const skyColumn = Math.floor((player.angle - Math.atan(offset)) * SKY_COLUMNS_PER_RADIAN) & (SKY_WIDTH - 1);
            collectHits(viewX, viewY, rayX, rayY);
            let clipTop = 0;
            let clipBottom = VIEW_HEIGHT;
            for (let hitIndex = 0; hitIndex < hitCount && clipTop < clipBottom; hitIndex++) {
                const line = hitLines[hitIndex];
                const onFront = hitOnFront[hitIndex] === 1;
                const near = onFront ? line.front : line.back;
                const far = onFront ? line.back : line.front;
                if (near === null) { continue; }
                const depth = hitParams[hitIndex];
                const scale = PROJECTION_DISTANCE / depth;
                const flatMap = startMapFor(near.light, 0);
                const ceilingEnd = boundaryRow(VIEW_CENTER_ROW - (near.ceil - viewZ) * scale, clipTop, clipBottom);
                if (near.ceilFlat === null) {
                    drawSkySpan(column, clipTop, ceilingEnd, skyColumn);
                } else {
                    drawFlatSpan(column, clipTop, ceilingEnd, near.ceilFlat, near.ceil, flatMap, rayX, rayY);
                }
                const floorStart = boundaryRow(VIEW_CENTER_ROW - (near.floor - viewZ) * scale, ceilingEnd, clipBottom);
                drawFlatSpan(column, floorStart, clipBottom, near.floorFlat, near.floor, flatMap, rayX, rayY);
                clipTop = ceilingEnd;
                clipBottom = floorStart;
                const wallMap = startMapFor(near.light, line.contrast);
                const textureU = line.textureOffset + (onFront ? 1 - hitLineParams[hitIndex] : hitLineParams[hitIndex]) * line.length;
                if (far === null) {
                    const anchorZ = line.pegBottom ? near.floor + line.middle.height : near.ceil;
                    drawWallSpan(column, clipTop, clipBottom, line.middle, textureU, anchorZ, depth, wallMap);
                    break;
                }
                if (far.ceil < near.ceil) {
                    const upperEnd = boundaryRow(VIEW_CENTER_ROW - (far.ceil - viewZ) * scale, clipTop, clipBottom);
                    drawWallSpan(column, clipTop, upperEnd, far.side, textureU, far.ceil + far.side.height, depth, wallMap);
                    clipTop = upperEnd;
                }
                if (far.floor > near.floor) {
                    const lowerStart = boundaryRow(VIEW_CENTER_ROW - (far.floor - viewZ) * scale, clipTop, clipBottom);
                    drawWallSpan(column, lowerStart, clipBottom, far.side, textureU, far.floor, depth, wallMap);
                    clipBottom = lowerStart;
                }
            }
        }
    }

    function renderThings(forwardX, forwardY) {
        const rightX = forwardY;
        const rightY = -forwardX;
        const visible = [];
        for (const thing of things) {
            const depth = (thing.x - viewX) * forwardX + (thing.y - viewY) * forwardY;
            if (depth >= MIN_SPRITE_DEPTH) { visible.push({ thing: thing, depth: depth }); }
        }
        visible.sort((first, second) => second.depth - first.depth);
        for (const entry of visible) {
            const thing = entry.thing;
            const depth = entry.depth;
            const sprite = thing.sprite;
            const scale = PROJECTION_DISTANCE / depth;
            const side = (thing.x - viewX) * rightX + (thing.y - viewY) * rightY;
            const leftEdge = HALF_SCREEN_WIDTH + side * scale - sprite.width * scale / 2;
            const topEdge = VIEW_CENTER_ROW - (thing.z - viewZ) * scale - sprite.height * scale;
            const columnStart = Math.max(0, Math.ceil(leftEdge - 0.5));
            const columnEnd = Math.min(SCREEN_WIDTH, Math.ceil(leftEdge + sprite.width * scale - 0.5));
            const rowStart = Math.max(0, Math.ceil(topEdge - 0.5));
            const rowEnd = Math.min(VIEW_HEIGHT, Math.ceil(topEdge + sprite.height * scale - 0.5));
            const shadeOffset = (thing.fullBright ? 0 : shadeLevelFor(startMapFor(thing.sector.light, 0), depth)) * PALETTE_SIZE;
            for (let column = columnStart; column < columnEnd; column++) {
                const spriteColumn = Math.min(sprite.width - 1, ((column + 0.5 - leftEdge) / scale) | 0);
                for (let row = rowStart; row < rowEnd; row++) {
                    const spriteRow = Math.min(sprite.height - 1, ((row + 0.5 - topEdge) / scale) | 0);
                    const texel = sprite.pixels[spriteRow * sprite.width + spriteColumn];
                    const pixelIndex = row * SCREEN_WIDTH + column;
                    if (texel !== TRANSPARENT_INDEX && depthBuffer[pixelIndex] >= depth) {
                        framePixels[pixelIndex] = shadedColors[shadeOffset + texel];
                    }
                }
            }
        }
    }

    // Copies a sprite to the screen at a fixed position. Rows at or below rowLimit stay untouched.
    function blitSprite(sprite, left, top, shadeLevel, rowLimit) {
        const shadeOffset = shadeLevel * PALETTE_SIZE;
        for (let spriteRow = 0; spriteRow < sprite.height; spriteRow++) {
            const row = top + spriteRow;
            if (row < 0 || row >= rowLimit) { continue; }
            for (let spriteColumn = 0; spriteColumn < sprite.width; spriteColumn++) {
                const column = left + spriteColumn;
                const texel = sprite.pixels[spriteRow * sprite.width + spriteColumn];
                if (texel !== TRANSPARENT_INDEX && column >= 0 && column < SCREEN_WIDTH) {
                    framePixels[row * SCREEN_WIDTH + column] = shadedColors[shadeOffset + texel];
                }
            }
        }
    }

    function glyphFor(font, character) {
        const glyph = font.get(character);
        if (glyph === undefined) { throw new Error('The font has no glyph for "' + character + '".'); }
        return glyph;
    }

    function textWidth(font, text) {
        let width = 0;
        for (const character of text) {
            width += glyphFor(font, character).advance;
        }
        return width;
    }

    function drawText(font, text, left, top) {
        let glyphLeft = left;
        for (const character of text) {
            const glyph = glyphFor(font, character);
            blitSprite(glyph, glyphLeft, top, 0, SCREEN_HEIGHT);
            glyphLeft += glyph.advance;
        }
    }

    function drawTextRight(font, text, right, top) {
        drawText(font, text, right - textWidth(font, text), top);
    }

    function drawTextCentered(font, text, top) {
        drawText(font, text, Math.round((SCREEN_WIDTH - textWidth(font, text)) / 2), top);
    }

    function drawWeapon() {
        const WEAPON_DEAD_DROP = 4;
        const GUN_FLASH_VISIBLE_TICS = 4;
        const FLASH_RISE = 34;
        const frame = weapon.step === WEAPON_READY ? 0 : PISTOL_SEQUENCE[weapon.step].frame;
        const left = Math.round(HALF_SCREEN_WIDTH - SPRITE_CENTER + weapon.bobX);
        const top = Math.round(VIEW_HEIGHT - SPRITE_SIZE + weapon.bobY + (player.dead ? player.deadTics * WEAPON_DEAD_DROP : 0));
        const flashing = weapon.flashTics > 0;
        const shadeLevel = flashing ? 0 : clamp(startMapFor(player.sector.light, 0) - MAX_LIGHT_ADJUSTMENT, 0, SHADE_LEVEL_COUNT - 1);
        if (flashing && weapon.flashTics > GUN_FLASH_TICS - GUN_FLASH_VISIBLE_TICS) {
            blitSprite(sprites.pistolFlash, left + SPRITE_CENTER - Math.round(sprites.pistolFlash.width / 2), top - FLASH_RISE, 0, VIEW_HEIGHT);
        }
        blitSprite(sprites.pistol[frame], left, top, shadeLevel, VIEW_HEIGHT);
    }

    function drawStatusBar() {
        framePixels.set(statusBarColors, VIEW_HEIGHT * SCREEN_WIDTH);
        const ammoText = String(player.ammo);
        const healthText = String(player.health);
        const armorText = String(player.armor);
        drawTextRight(numberFont, ammoText, AMMO_RIGHT, BIG_NUMBER_TOP);
        drawTextRight(numberFont, healthText, HEALTH_RIGHT, BIG_NUMBER_TOP);
        drawText(numberFont, '%', HEALTH_RIGHT, BIG_NUMBER_TOP);
        drawTextRight(numberFont, armorText, ARMOR_RIGHT, BIG_NUMBER_TOP);
        drawText(numberFont, '%', ARMOR_RIGHT, BIG_NUMBER_TOP);
        plotTinyTextRight(statusBarPlotter(STATUS_YELLOW), ammoText, AMMO_LIST_COUNT_RIGHT, AMMO_LIST_TOP);
        const bloodLevel = Math.min(FACE_BLOOD_LEVELS - 1, Math.floor((MAX_HEALTH - player.health) * FACE_BLOOD_LEVELS / (MAX_HEALTH + 1)));
        const faceSprite = player.dead ? sprites.deadFace : face.ouchTics > 0 ? sprites.ouchFaces[bloodLevel] : sprites.faces[bloodLevel][face.lookIndex];
        blitSprite(faceSprite, FACE_LEFT, FACE_TOP, 0, SCREEN_HEIGHT);
    }

    function renderGameFrame() {
        viewX = player.x;
        viewY = player.y;
        const bobOffset = player.bob / 2 * Math.sin(TWO_PI * levelTic / VIEW_BOB_PERIOD_TICS);
        viewZ = Math.min(player.z + player.viewHeight + bobOffset, player.ceilZ - CEILING_VIEW_MARGIN);
        const forwardX = Math.cos(player.angle);
        const forwardY = Math.sin(player.angle);
        renderWorld(forwardX, forwardY);
        renderThings(forwardX, forwardY);
        drawWeapon();
        drawStatusBar();
        if (message.tics > 0) { drawText(messageFont, message.text, 2, 1); }
        if (mode === 'finished') {
            drawTextCentered(numberFont, 'LEVEL FINISHED', 50);
            drawTextCentered(messageFont, 'KILLS ' + killCount + '/' + monsterCount, 76);
            drawTextCentered(messageFont, 'PRESS SPACE', 92);
        } else if (player.dead && player.deadTics > RESTART_DELAY_TICS) {
            drawTextCentered(messageFont, 'PRESS SPACE', 76);
        }
    }

    function renderTitle() {
        const TITLE_SHADE_LEVEL = 14;
        const HELP_LINES = ['ARROWS: MOVE AND TURN', 'CTRL: FIRE', 'SPACE: OPEN DOORS AND USE SWITCHES', 'SHIFT: RUN', 'ALT+ARROWS OR , AND . : STRAFE'];
        const wall = textures.brown;
        for (let row = 0; row < SCREEN_HEIGHT; row++) {
            for (let column = 0; column < SCREEN_WIDTH; column++) {
                framePixels[row * SCREEN_WIDTH + column] =
                    shadedColors[TITLE_SHADE_LEVEL * PALETTE_SIZE + wall.pixels[(row % wall.height) * wall.width + (column % wall.width)]];
            }
        }
        drawTextCentered(numberFont, 'CLICK TO START', 40);
        HELP_LINES.forEach((helpLine, lineIndex) => drawTextCentered(messageFont, helpLine, 86 + lineIndex * 14));
    }

    // ---------------------------------------------------------------- screen wipe

    const WIPE_COLUMN_WIDTH = 2;
    const WIPE_MAX_DELAY = 15;
    const WIPE_FAST_STEP = 8;

    function startWipe() {
        wipeOldPixels = framePixels.slice();
        wipeOffsets = new Int32Array(SCREEN_WIDTH / WIPE_COLUMN_WIDTH);
        wipeOffsets[0] = -(randomByte() % (WIPE_MAX_DELAY + 1));
        for (let stripIndex = 1; stripIndex < wipeOffsets.length; stripIndex++) {
            wipeOffsets[stripIndex] = clamp(wipeOffsets[stripIndex - 1] + (randomByte() % 3) - 1, -WIPE_MAX_DELAY, 0);
        }
    }

    function advanceWipe() {
        let finished = true;
        for (let stripIndex = 0; stripIndex < wipeOffsets.length; stripIndex++) {
            const offset = wipeOffsets[stripIndex];
            if (offset < 0) {
                wipeOffsets[stripIndex] = offset + 1;
                finished = false;
            } else if (offset < SCREEN_HEIGHT) {
                wipeOffsets[stripIndex] = Math.min(SCREEN_HEIGHT, offset + (offset < WIPE_FAST_STEP * 2 ? offset + 1 : WIPE_FAST_STEP));
                finished = false;
            }
        }
        if (finished) {
            wipeOffsets = null;
            wipeOldPixels = null;
        }
    }

    function composeWipe() {
        for (let column = 0; column < SCREEN_WIDTH; column++) {
            const offset = Math.max(0, wipeOffsets[Math.floor(column / WIPE_COLUMN_WIDTH)]);
            for (let row = SCREEN_HEIGHT - 1; row >= offset; row--) {
                framePixels[row * SCREEN_WIDTH + column] = wipeOldPixels[(row - offset) * SCREEN_WIDTH + column];
            }
        }
    }

    // ---------------------------------------------------------------- main loop

    function restartLevel() {
        startWipe();
        startLevel();
        mode = 'play';
    }

    // ---------------------------------------------------------------- demo

    // Typing DEMO_CHEAT_CODE restarts the level and plays DEMO_INPUT, a recorded run that kills every monster, collects every item, and uses the exit switch.
    const DEMO_CHEAT_CODE = 'runbabyrun';
    const DEMO_SEED = 1993;
    const DEMO_KEY_CODES = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ControlLeft', 'ShiftLeft', 'AltLeft', 'Comma', 'Period'];
    const DEMO_USE_BIT = 1 << DEMO_KEY_CODES.length;
    // Each entry is MASK*TICS. For TICS tics, bit N of MASK holds DEMO_KEY_CODES[N] down, and DEMO_USE_BIT taps the use key.
    const DEMO_INPUT = '37*4,293*7,292*3,296*6,169*3,168*5,170*6,42*2,34*1,42*3,58*1,34*2,290*4,0*2,4*1,0*8,4*1,0*1,16*1,0*19,16*1,0*4,41*1,296*6,297*2,169*4,168*1,170*3,'
        + '168*2,170*6,42*1,50*1,42*5,34*1,42*6,38*1,34*1,38*2,34*3,306*1,290*3,294*1,37*7,293*1,289*1,293*3,289*14,293*1,289*13,293*2,166*9,164*9,165*2,37*1,'
        + '293*1,37*2,296*3,297*3,37*3,296*3,165*1,296*3,164*1,165*6,37*6,293*1,289*1,293*2,289*1,297*1,289*1,297*2,289*1,297*3,809*2,801*2,549*1,37*1,165*7,37*5,'
        + '293*1,289*1,297*8,289*1,297*4,313*1,289*1,293*1,289*1,293*4,4*2,0*1,4*8,0*1,20*1,4*2,38*1,4*1,0*1,4*5,0*2,4*2,0*1,38*1,4*1,0*2,20*1,0*2,288*1,292*1,'
        + '288*1,292*5,288*1,292*8,288*1,292*3,294*2,37*2,33*1,37*1,294*4,290*1,294*3,38*3,16*1,4*3,0*16,16*1,0*19,16*1,0*19,16*1,0*4,4*26,16*1,4*1,0*18,16*1,'
        + '0*19,16*1,0*19,16*1,4*1,0*2,8*1,0*11,8*1,0*2,8*1,16*1,0*1,8*1,0*13,8*1,0*3,16*1,0*1,8*1,0*2,8*1,0*2,4*1,0*2,4*1,0*2,4*2,0*4,16*1,0*4,296*1,37*8,296*8,'
        + '297*3,289*1,297*2,289*5,297*1,289*7,297*1,289*4,297*4,41*1,553*1,37*5,293*1,289*1,293*2,289*3,297*2,289*1,297*2,289*1,297*2,289*1,297*1,289*2,297*1,'
        + '289*10,37*6,293*1,289*1,293*3,289*4,164*1,297*1,289*8,166*8,164*4,165*9,37*6,293*1,289*1,293*3,289*4,297*7,289*1,297*5,289*1,297*4,289*1,297*5,289*1,'
        + '297*7,296*2,297*1,549*1,37*9,293*1,289*2,297*6,289*1,297*1,313*1,289*5,293*1,289*2,37*1,33*2,37*1,33*2,161*5,185*1,169*1,168*6,170*3,42*3,298*2,169*4,'
        + '161*1,169*3,168*2,160*1,168*6,160*1,166*6,37*4,293*2,289*1,297*2,289*2,297*1,289*6,297*6,41*1,8*40,16*1,8*1,0*18,16*1,0*4,37*1,292*6,288*1,292*1,37*7,'
        + '38*1,50*1,38*4,37*3,33*1,38*3,34*1,33*2,37*1,33*2,34*2,54*1,34*2,33*5,34*1,38*1,34*1,288*2,292*1,164*1,162*3,160*1,41*1,57*1,33*1,41*1,33*1,41*1,33*2,'
        + '42*1,34*1,42*1,34*2,42*1,34*1,33*2,41*1,33*1,34*2,50*1,34*1,42*1,33*1,34*2,33*7,34*1,160*1,168*7,42*1,58*1,34*1,42*6,34*1,42*6,34*1,42*1,41*3,42*3,'
        + '50*1,41*2,169*1,42*2,34*1,161*1,34*1,42*1,34*1,38*1,161*1,169*1,296*3,288*1,292*1,296*1,308*1,292*1,34*3,165*7,37*4,165*2,164*4,165*3,164*4,165*5,37*1,'
        + '297*1,41*1,553*2,545*1,553*5,37*1,293*1,289*1,293*5,289*1,293*2,289*2,293*4,309*1,289*1,293*1,34*1,42*1,34*1,289*1,297*1,289*1,293*1,34*1,38*1,34*1,'
        + '42*1,34*1,42*2,168*3,176*1,168*2,298*2,297*2,289*1,297*1,41*1,33*1,42*1,38*1,34*1,38*1,34*1,38*1,33*2,37*1,49*1,33*2,34*2,38*1,34*2,33*3,41*1,288*1,'
        + '292*1,288*3,292*1,288*1,296*1,58*1,34*1,42*2,34*2,160*1,168*1,160*1,168*1,296*2,288*1,292*1,37*1,33*2,37*1,33*2,50*1,38*1,34*4,38*1,33*7,34*1,288*1,'
        + '292*1,288*3,304*1,288*2,34*6,160*1,168*2,296*1,288*4,37*2,33*1,49*1,33*3,34*7,33*2,160*2,168*5,176*1,41*3,33*1,37*6,293*1,289*1,293*1,289*1,297*1,'
        + '289*1,297*1,289*1,297*3,169*2,161*1,169*1,161*3,160*1,161*3,673*1,0*19';

    function expandDemoInput(text) {
        const masks = [];
        for (const entry of text.split(',')) {
            const parts = entry.split('*');
            const mask = Number(parts[0]);
            const tics = Number(parts[1]);
            if (parts.length !== 2 || !Number.isInteger(mask) || !Number.isInteger(tics) || tics < 1) {
                throw new Error('Invalid demo input entry: "' + entry + '".');
            }
            for (let ticIndex = 0; ticIndex < tics; ticIndex++) { masks.push(mask); }
        }
        return masks;
    }

    function startDemo() {
        if (mode === 'title') { startAudio(); }
        gameRandom = createRandomGenerator(DEMO_SEED);
        demoMasks = expandDemoInput(DEMO_INPUT);
        restartLevel();
        showMessage('RUN BABY RUN');
    }

    function stopDemo() {
        gameRandom = Math.random;
        demoMasks = null;
        heldKeys.clear();
    }

    function demoMaskAt(tic) {
        return demoMasks[tic - 1];
    }

    // Replaces the held keys with the recorded keys for this tic. Returns whether the recording taps the use key.
    function applyDemoInput() {
        const mask = demoMaskAt(levelTic);
        heldKeys.clear();
        DEMO_KEY_CODES.forEach((code, bitIndex) => {
            if ((mask & (1 << bitIndex)) !== 0) { heldKeys.add(code); }
        });
        return (mask & DEMO_USE_BIT) !== 0;
    }

    function runTic() {
        if (mode === 'title') { return; }
        const tapped = useTapped;
        useTapped = false;
        if (wipeOffsets !== null) {
            advanceWipe();
            return;
        }
        if (mode === 'finished') {
            if (tapped) { restartLevel(); }
            return;
        }
        levelTic++;
        thinkPlayer(demoMasks === null ? tapped : applyDemoInput());
        thinkWeapon();
        thinkThings();
        thinkDoors();
        thinkSectors();
        if (exitTics > 0) {
            exitTics--;
            if (exitTics === 0) { mode = 'finished'; }
        }
        if (demoMasks !== null && (mode === 'finished' || player.dead || levelTic === demoMasks.length)) { stopDemo(); }
        if (player.dead && player.deadTics > RESTART_DELAY_TICS && tapped) { restartLevel(); }
    }

    function present() {
        screenContext.putImageData(frameImage, 0, 0);
        if (mode === 'title' || wipeOffsets !== null) { return; }
        const DAMAGE_TINT_STEPS = 9;
        const BONUS_TINT_STEPS = 8;
        if (player.damageCount > 0) {
            const strength = Math.min(DAMAGE_TINT_STEPS - 1, (player.damageCount + 7) >> 3);
            fillBox(screenContext, translucent(255, 0, 0, strength / DAMAGE_TINT_STEPS), 0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);
        } else if (player.dead) {
            fillBox(screenContext, translucent(255, 0, 0, 0.3), 0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);
        } else if (player.bonusCount > 0) {
            const strength = Math.min(4, (player.bonusCount + 7) >> 3);
            fillBox(screenContext, translucent(215, 186, 69, strength / BONUS_TINT_STEPS), 0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);
        }
    }

    let previousTimestamp = null;
    let pendingMilliseconds = 0;

    function animationFrame(timestamp) {
        if (previousTimestamp !== null) { pendingMilliseconds += timestamp - previousTimestamp; }
        previousTimestamp = timestamp;
        let ticsToRun = Math.floor(pendingMilliseconds / TIC_MILLISECONDS);
        pendingMilliseconds -= ticsToRun * TIC_MILLISECONDS;
        if (ticsToRun > MAX_TICS_PER_FRAME) { ticsToRun = MAX_TICS_PER_FRAME; }
        for (let ticIndex = 0; ticIndex < ticsToRun; ticIndex++) { runTic(); }
        if (ticsToRun > 0 && mode !== 'title') {
            renderGameFrame();
            if (wipeOffsets !== null) { composeWipe(); }
            present();
        }
        requestAnimationFrame(animationFrame);
    }

    function startGame() {
        if (mode !== 'title') { return; }
        startAudio();
        restartLevel();
    }

    const GAME_KEYS = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ControlLeft', 'ControlRight', 'Space',
        'ShiftLeft', 'ShiftRight', 'AltLeft', 'AltRight', 'Comma', 'Period']);

    window.addEventListener('keydown', (keyEvent) => {
        if (keyEvent.key.length === 1) {
            typedCharacters = (typedCharacters + keyEvent.key.toLowerCase()).slice(-DEMO_CHEAT_CODE.length);
            if (typedCharacters === DEMO_CHEAT_CODE) {
                typedCharacters = '';
                startDemo();
                return;
            }
        }
        if (!GAME_KEYS.has(keyEvent.code)) { return; }
        keyEvent.preventDefault();
        if (mode === 'title') {
            startGame();
            return;
        }
        if (keyEvent.code === 'Space' && !keyEvent.repeat) { useTapped = true; }
        heldKeys.add(keyEvent.code);
    });
    window.addEventListener('keyup', (keyEvent) => {
        if (GAME_KEYS.has(keyEvent.code)) { keyEvent.preventDefault(); }
        heldKeys.delete(keyEvent.code);
    });
    window.addEventListener('blur', () => heldKeys.clear());
    screenCanvas.addEventListener('click', startGame);

    buildPalette();
    textures = createTextures();
    sprites = createSprites();
    messageFont = createFont(1, [239, 0, 0], [127, 0, 0], [67, 0, 0]);
    numberFont = createFont(2, [203, 0, 0], [115, 0, 0], [67, 0, 0]);
    statusBarColors = createStatusBar();
    renderTitle();
    present();
    requestAnimationFrame(animationFrame);
    setTimeout(synthesizeSoundsInBackground, 0);
}());
</script>
