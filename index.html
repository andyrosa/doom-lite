<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doom-lite</title>
<style>
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
body { display: flex; align-items: center; justify-content: center; }
canvas { width: min(100vw, 133.333vh); height: min(75vw, 100vh); image-rendering: pixelated; cursor: pointer; }
</style>
</head>
<body>
<canvas id="screen" width="320" height="200"></canvas>
<script>
(function () {
    'use strict';

    // ---------------------------------------------------------------- constants

    const SCREEN_WIDTH = 320;
    const SCREEN_HEIGHT = 200;
    const STATUS_BAR_HEIGHT = 32;
    const VIEW_HEIGHT = SCREEN_HEIGHT - STATUS_BAR_HEIGHT;
    const VIEW_CENTER_ROW = VIEW_HEIGHT / 2;
    const HALF_SCREEN_WIDTH = SCREEN_WIDTH / 2;
    const PROJECTION_DISTANCE = SCREEN_WIDTH / 2;
    const TICS_PER_SECOND = 35;
    const TIC_MILLISECONDS = 1000 / TICS_PER_SECOND;
    const MAX_TICS_PER_FRAME = 4;
    const TWO_PI = Math.PI * 2;

    const PALETTE_SIZE = 256;
    const TRANSPARENT_INDEX = 0;
    const SHADE_LEVEL_COUNT = 32;
    const LIGHT_NUMBER_COUNT = 16;
    const LIGHT_DISTANCE_FACTOR = 1280;
    const MAX_LIGHT_ADJUSTMENT = 23;
    const ALPHA_OPAQUE_THRESHOLD = 128;

    const FLAT_SIZE = 64;
    const FLAT_MASK = FLAT_SIZE - 1;
    const FLAT_SHIFT = 6;
    const SKY_WIDTH = 256;
    const SKY_HEIGHT = 128;
    const SKY_ROW_OFFSET = 16;
    const SKY_COLUMNS_PER_RADIAN = (SKY_WIDTH * 4) / TWO_PI;
    const SKY_FLAT = 'sky';
    const TEXTURE_V_BIAS_REPEATS = 1024;

    const MIN_RAY_PARAM = 0.001;
    const MAX_HITS = 256;
    const MIN_SPRITE_DEPTH = 4;

    const PLAYER_RADIUS = 16;
    const PLAYER_HEIGHT = 56;
    const PLAYER_VIEW_HEIGHT = 41;
    const DEAD_VIEW_HEIGHT = 6;
    const MAX_STEP_HEIGHT = 24;
    const CEILING_VIEW_MARGIN = 4;
    const FRICTION = 0.90625;
    const STOP_SPEED = 0.0625;
    const THRUST_DIVISOR = 32;
    const WALK_FORWARD_MOVE = 25;
    const RUN_FORWARD_MOVE = 50;
    const WALK_SIDE_MOVE = 24;
    const RUN_SIDE_MOVE = 40;
    const SLOW_TURN_TICS = 6;
    const SLOW_TURN_RADIANS = (320 / 65536) * TWO_PI;
    const WALK_TURN_RADIANS = (640 / 65536) * TWO_PI;
    const RUN_TURN_RADIANS = (1280 / 65536) * TWO_PI;
    const GRAVITY = 1;
    const MAX_BOB = 16;
    const VIEW_BOB_PERIOD_TICS = 20;
    const WEAPON_BOB_PERIOD_TICS = 64;
    const USE_RANGE = 64;
    const SHOT_RANGE = 2048;
    const SHOT_HEIGHT = 32;
    const PUFF_PULLBACK = 4;
    const PISTOL_SPREAD_RADIANS = (255 * 262144 / 4294967296) * TWO_PI / 255;
    const ZOMBIE_SPREAD_RADIANS = (255 * 1048576 / 4294967296) * TWO_PI / 255;
    const START_HEALTH = 100;
    const START_AMMO = 50;
    const MAX_HEALTH = 100;
    const MAX_AMMO = 200;
    const MAX_ARMOR = 100;
    const ARMOR_ABSORB_DIVISOR = 3;
    const STIMPACK_HEALTH = 10;
    const CLIP_AMMO = 10;
    const DROPPED_CLIP_AMMO = 5;
    const BONUS_FLASH_TICS = 6;
    const MAX_DAMAGE_FLASH = 100;
    const MESSAGE_TICS = 140;
    const NUKAGE_DAMAGE = 5;
    const NUKAGE_DAMAGE_INTERVAL_MASK = 31;
    const NUKAGE_FRAME_TICS = 8;
    const RESTART_DELAY_TICS = 35;
    const EXIT_DELAY_TICS = 20;
    const FACE_LOOK_TICS = 18;
    const FACE_OUCH_TICS = 20;
    const FACE_BLOOD_LEVELS = 5;
    const GUN_FLASH_TICS = 7;

    const DOOR_SPEED = 2;
    const DOOR_WAIT_TICS = 150;
    const DOOR_HEAD_CLEARANCE = 4;
    const BIG_DOOR_FRAME_HEIGHT = 128;
    const DOOR_FRAME_HEIGHT = 72;

    const MONSTER_RADIUS = 20;
    const MONSTER_HEIGHT = 56;
    const MONSTER_EYE_HEIGHT = 42;
    const MONSTER_SPEED = 8;
    const MONSTER_REACTION_STEPS = 8;
    const MELEE_RANGE = 64;
    const IDLE_LOOK_TICS = 10;
    const PAIN_TICS = 6;
    const DEATH_FRAME_TICS = 5;
    const DIAGONAL = 0.7071;
    const DIRECTION_VECTORS = [[1, 0], [DIAGONAL, DIAGONAL], [0, 1], [-DIAGONAL, DIAGONAL], [-1, 0], [-DIAGONAL, -DIAGONAL], [0, -1], [DIAGONAL, -DIAGONAL]];
    const NO_DIRECTION = -1;
    const DIRECTION_EAST = 0;
    const DIRECTION_NORTH = 2;
    const DIRECTION_WEST = 4;
    const DIRECTION_SOUTH = 6;
    const CHASE_AXIS_THRESHOLD = 10;
    const FIREBALL_SPEED = 10;
    const FIREBALL_RADIUS = 6;
    const FIREBALL_HEIGHT = 8;
    const ITEM_RADIUS = 20;

    const SOUND_SAMPLE_RATE = 11025;
    const SOUND_CLOSE_DISTANCE = 160;
    const SOUND_CLIP_DISTANCE = 1200;
    const SOUND_PEAK = 0.9;
    const SOUND_PAN_WIDTH = 0.8;

    const FACE_LEFT = 148;
    const FACE_TOP = 170;
    const BIG_NUMBER_TOP = 171;
    const AMMO_RIGHT = 44;
    const HEALTH_RIGHT = 90;
    const ARMOR_RIGHT = 221;

    // ---------------------------------------------------------------- helpers

    function clamp(value, low, high) {
        return value < low ? low : value > high ? high : value;
    }

    function createRandomGenerator(seed) {
        let state = seed >>> 0;
        return function () {
            state = (state + 0x6D2B79F5) >>> 0;
            let mixed = state;
            mixed = Math.imul(mixed ^ (mixed >>> 15), mixed | 1);
            mixed ^= mixed + Math.imul(mixed ^ (mixed >>> 7), mixed | 61);
            return ((mixed ^ (mixed >>> 14)) >>> 0) / 4294967296;
        };
    }

    const ASSET_SEED = 1993;
    const assetRandom = createRandomGenerator(ASSET_SEED);

    // The demo replaces gameRandom with a seeded generator, so that its recorded input meets the same game every time.
    let gameRandom = Math.random;

    function randomByte() {
        return (gameRandom() * 256) | 0;
    }

    function normalizeAngle(angle) {
        let result = angle % TWO_PI;
        if (result > Math.PI) { result -= TWO_PI; }
        if (result < -Math.PI) { result += TWO_PI; }
        return result;
    }

    function createCanvasContext(width, height) {
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const context = canvas.getContext('2d', { willReadFrequently: true });
        if (context === null) { throw new Error('The browser gave no 2D canvas context.'); }
        return context;
    }

    function fillBox(context, color, left, top, width, height) {
        context.fillStyle = color;
        context.fillRect(left, top, width, height);
    }

    function fillShape(context, color, points) {
        context.fillStyle = color;
        context.beginPath();
        context.moveTo(points[0][0], points[0][1]);
        for (let pointIndex = 1; pointIndex < points.length; pointIndex++) {
            context.lineTo(points[pointIndex][0], points[pointIndex][1]);
        }
        context.closePath();
        context.fill();
    }

    function fillOval(context, color, centerX, centerY, radiusX, radiusY) {
        context.fillStyle = color;
        context.beginPath();
        context.ellipse(centerX, centerY, radiusX, radiusY, 0, 0, TWO_PI);
        context.fill();
    }

    function strokeLine(context, color, lineWidth, fromX, fromY, toX, toY) {
        context.strokeStyle = color;
        context.lineWidth = lineWidth;
        context.lineCap = 'round';
        context.beginPath();
        context.moveTo(fromX, fromY);
        context.lineTo(toX, toY);
        context.stroke();
    }

    // ---------------------------------------------------------------- palette

    // Each ramp is [entry count, first color, last color]. The ramps follow the color families of Doom's palette in
    // the same order, so that a color index means the same family as in Doom. Index 0 marks a transparent pixel.
    const PALETTE_RAMPS = [
        [1, [0, 0, 0], [0, 0, 0]],
        [1, [31, 23, 11], [31, 23, 11]],
        [1, [23, 15, 7], [23, 15, 7]],
        [1, [75, 75, 75], [75, 75, 75]],
        [1, [255, 255, 255], [255, 255, 255]],
        [4, [27, 27, 27], [7, 7, 7]],
        [4, [47, 55, 31], [15, 23, 0]],
        [3, [79, 59, 43], [63, 43, 27]],
        [32, [255, 183, 183], [67, 0, 0]],
        [8, [255, 235, 223], [255, 187, 147]],
        [8, [255, 179, 131], [203, 127, 79]],
        [16, [191, 123, 75], [43, 35, 15]],
        [32, [239, 239, 239], [35, 35, 35]],
        [16, [119, 255, 111], [11, 23, 7]],
        [16, [191, 167, 143], [83, 63, 47]],
        [8, [159, 131, 99], [67, 51, 27]],
        [8, [123, 127, 99], [55, 63, 39]],
        [8, [255, 255, 115], [115, 43, 0]],
        [8, [255, 255, 255], [255, 31, 31]],
        [16, [255, 0, 0], [67, 0, 0]],
        [8, [231, 231, 255], [27, 27, 255]],
        [8, [0, 0, 255], [0, 0, 83]],
        [8, [255, 255, 255], [255, 127, 27]],
        [8, [243, 115, 23], [175, 67, 0]],
        [8, [255, 255, 255], [255, 255, 0]],
        [4, [167, 63, 0], [135, 35, 0]],
        [4, [79, 59, 39], [47, 27, 11]],
        [8, [0, 0, 83], [0, 0, 0]],
        [1, [255, 159, 67], [255, 159, 67]],
        [1, [255, 231, 75], [255, 231, 75]],
        [1, [255, 123, 255], [255, 123, 255]],
        [1, [255, 0, 255], [255, 0, 255]],
        [1, [207, 0, 207], [207, 0, 207]],
        [1, [159, 0, 155], [159, 0, 155]],
        [1, [111, 0, 107], [111, 0, 107]],
        [1, [167, 107, 107], [167, 107, 107]]
    ];
    const FIRST_OPAQUE_INDEX = 1;

    const paletteRed = new Uint8Array(PALETTE_SIZE);
    const paletteGreen = new Uint8Array(PALETTE_SIZE);
    const paletteBlue = new Uint8Array(PALETTE_SIZE);
    const shadedColors = new Uint32Array(SHADE_LEVEL_COUNT * PALETTE_SIZE);
    const nearestColorCache = new Map();

    function nearestPaletteIndex(red, green, blue) {
        const key = (red << 16) | (green << 8) | blue;
        const cached = nearestColorCache.get(key);
        if (cached !== undefined) { return cached; }
        let bestIndex = FIRST_OPAQUE_INDEX;
        let bestDistance = Infinity;
        for (let paletteIndex = FIRST_OPAQUE_INDEX; paletteIndex < PALETTE_SIZE; paletteIndex++) {
            const redDifference = paletteRed[paletteIndex] - red;
            const greenDifference = paletteGreen[paletteIndex] - green;
            const blueDifference = paletteBlue[paletteIndex] - blue;
            const distance = redDifference * redDifference + greenDifference * greenDifference + blueDifference * blueDifference;
            if (distance < bestDistance) {
                bestDistance = distance;
                bestIndex = paletteIndex;
            }
        }
        nearestColorCache.set(key, bestIndex);
        return bestIndex;
    }

    function buildPalette() {
        let paletteIndex = 0;
        for (const ramp of PALETTE_RAMPS) {
            const entryCount = ramp[0];
            for (let entry = 0; entry < entryCount; entry++) {
                const blend = entryCount === 1 ? 0 : entry / (entryCount - 1);
                paletteRed[paletteIndex] = Math.round(ramp[1][0] + (ramp[2][0] - ramp[1][0]) * blend);
                paletteGreen[paletteIndex] = Math.round(ramp[1][1] + (ramp[2][1] - ramp[1][1]) * blend);
                paletteBlue[paletteIndex] = Math.round(ramp[1][2] + (ramp[2][2] - ramp[1][2]) * blend);
                paletteIndex++;
            }
        }
        if (paletteIndex !== PALETTE_SIZE) { throw new Error('The palette ramps define ' + paletteIndex + ' colors, expected ' + PALETTE_SIZE + '.'); }
        for (let level = 0; level < SHADE_LEVEL_COUNT; level++) {
            const brightness = 1 - level / SHADE_LEVEL_COUNT;
            for (let colorIndex = 0; colorIndex < PALETTE_SIZE; colorIndex++) {
                const darkIndex = nearestPaletteIndex(
                    Math.round(paletteRed[colorIndex] * brightness),
                    Math.round(paletteGreen[colorIndex] * brightness),
                    Math.round(paletteBlue[colorIndex] * brightness));
                shadedColors[level * PALETTE_SIZE + colorIndex] =
                    (0xFF000000 | (paletteBlue[darkIndex] << 16) | (paletteGreen[darkIndex] << 8) | paletteRed[darkIndex]) >>> 0;
            }
        }
    }

    // Draws with the canvas API, then converts the drawing to palette indexes. Transparent pixels become TRANSPARENT_INDEX.
    function rasterize(width, height, noiseAmount, paint) {
        const context = createCanvasContext(width, height);
        paint(context);
        const colorData = context.getImageData(0, 0, width, height).data;
        const pixels = new Uint8Array(width * height);
        for (let pixelIndex = 0; pixelIndex < pixels.length; pixelIndex++) {
            if (colorData[pixelIndex * 4 + 3] < ALPHA_OPAQUE_THRESHOLD) {
                pixels[pixelIndex] = TRANSPARENT_INDEX;
                continue;
            }
            const noise = (assetRandom() - 0.5) * 2 * noiseAmount;
            pixels[pixelIndex] = nearestPaletteIndex(
                clamp(Math.round(colorData[pixelIndex * 4] + noise), 0, 255),
                clamp(Math.round(colorData[pixelIndex * 4 + 1] + noise), 0, 255),
                clamp(Math.round(colorData[pixelIndex * 4 + 2] + noise), 0, 255));
        }
        return { width: width, height: height, pixels: pixels };
    }

    // ---------------------------------------------------------------- wall textures and flats

    // Each painter imitates the layout and colors of the Doom texture that its comment names.

    function translucent(red, green, blue, opacity) {
        return 'rgba(' + red + ',' + green + ',' + blue + ',' + opacity + ')';
    }

    // Adds the vertical grain that Doom's wall textures share: each pixel column gets its own brightness and a darker drip.
    function paintStreaks(context, left, top, width, height, strength) {
        for (let column = left; column < left + width; column++) {
            const shade = (assetRandom() - 0.5) * strength;
            fillBox(context, shade < 0 ? translucent(0, 0, 0, -shade) : translucent(255, 255, 255, shade), column, top, 1, height);
            const dripTop = assetRandom() * height;
            fillBox(context, translucent(0, 0, 0, strength * 0.5), column, top + dripTop, 1, Math.min(height - dripTop, assetRandom() * height * 0.4));
        }
    }

    function paintDrips(context, left, top, width, maxLength, color, count) {
        for (let dripIndex = 0; dripIndex < count; dripIndex++) {
            fillBox(context, color, left + Math.floor(assetRandom() * width), top, 1, 3 + assetRandom() * maxLength);
        }
    }

    function paintMottled(context, width, height, baseColor, blobColors, blobCount) {
        fillBox(context, baseColor, 0, 0, width, height);
        for (let blobIndex = 0; blobIndex < blobCount; blobIndex++) {
            const centerX = assetRandom() * width;
            const centerY = assetRandom() * height;
            const radiusX = 2 + assetRandom() * 6;
            const radiusY = 2 + assetRandom() * 5;
            const color = blobColors[blobIndex % blobColors.length];
            for (const shiftX of [-width, 0, width]) {
                for (const shiftY of [-height, 0, height]) {
                    fillOval(context, color, centerX + shiftX, centerY + shiftY, radiusX, radiusY);
                }
            }
        }
    }

    function paintHazard(context, left, top, width, height) {
        context.save();
        context.beginPath();
        context.rect(left, top, width, height);
        context.clip();
        fillBox(context, '#1b1b1b', left, top, width, height);
        for (let stripeLeft = left - height; stripeLeft < left + width; stripeLeft += 8) {
            fillShape(context, '#d7bb43', [[stripeLeft, top + height], [stripeLeft + 4, top + height], [stripeLeft + 4 + height, top], [stripeLeft + height, top]]);
        }
        context.restore();
    }

    const STARTAN_GREY = { groove: '#3b3b3b', body: '#6f6f6f', light: '#8b8b8b', shine: '#b7b7b7', strip: '#575757', drips: 2 };
    const STARTAN_TAN = { groove: '#47372b', body: '#7b634f', light: '#8f7763', shine: '#cf8353', strip: '#67533f', drips: 7 };

    // One 32 by 64 panel of STARTAN3: a rounded cap, a tall streaked plate, and a low strip.
    function paintStartanPanel(context, left, top, tone) {
        fillBox(context, tone.groove, left, top, 32, 64);
        fillBox(context, tone.body, left + 2, top + 3, 28, 8);
        fillBox(context, tone.shine, left + 3, top + 3, 26, 2);
        fillBox(context, tone.light, left + 3, top + 5, 26, 2);
        const fade = context.createLinearGradient(0, top + 13, 0, top + 44);
        fade.addColorStop(0, tone.light);
        fade.addColorStop(0.3, tone.body);
        fade.addColorStop(1, tone.strip);
        fillBox(context, fade, left + 2, top + 13, 28, 31);
        fillBox(context, tone.shine, left + 3, top + 13, 26, 1);
        paintStreaks(context, left + 2, top + 14, 28, 30, 0.3);
        paintDrips(context, left + 3, top + 13, 26, 24, translucent(203, 111, 43, 0.45), tone.drips);
        fillBox(context, tone.strip, left + 1, top + 48, 30, 13);
        fillBox(context, tone.light, left + 1, top + 48, 30, 1);
        fillBox(context, tone.body, left + 7, top + 51, 18, 7);
        paintStreaks(context, left + 1, top + 49, 30, 12, 0.25);
    }

    // STARTAN3.
    function paintStartan(context) {
        for (const tileTop of [0, 64]) {
            for (let panel = 0; panel < 4; panel++) {
                paintStartanPanel(context, panel * 32, tileTop, panel === 1 || panel === 2 ? STARTAN_GREY : STARTAN_TAN);
            }
        }
    }

    // SW1STRTN: tan STARTAN panels with a switch plate. The plate sits where a 72-unit wall shows it at eye height.
    function paintSwitch(context, redColor, greenColor) {
        for (const tileTop of [0, 64]) {
            for (let panel = 0; panel < 2; panel++) { paintStartanPanel(context, panel * 32, tileTop, STARTAN_TAN); }
        }
        const plate = context.createLinearGradient(16, 0, 48, 0);
        plate.addColorStop(0, '#9b9b9b');
        plate.addColorStop(0.5, '#777777');
        plate.addColorStop(1, '#575757');
        fillBox(context, '#2f2f2f', 15, 21, 34, 34);
        fillBox(context, plate, 16, 22, 32, 32);
        fillBox(context, '#c7c7c7', 16, 22, 32, 1);
        fillBox(context, '#1b1b1b', 21, 26, 12, 11);
        fillBox(context, redColor, 22, 27, 10, 9);
        fillBox(context, '#1b1b1b', 21, 40, 12, 11);
        fillBox(context, greenColor, 22, 41, 10, 9);
        fillBox(context, '#2f2f2f', 38, 27, 2, 22);
        fillBox(context, '#b7b7b7', 37, 28, 4, 4);
    }

    // BROWN1.
    function paintBrown(context) {
        fillBox(context, '#6b553f', 0, 0, 128, 128);
        fillBox(context, translucent(127, 83, 47, 0.35), 64, 0, 64, 128);
        paintStreaks(context, 0, 0, 128, 128, 0.3);
        for (const seamTop of [14, 74]) {
            for (let stain = 0; stain < 14; stain++) {
                const stainLeft = Math.floor(assetRandom() * 124);
                const stainWidth = 3 + Math.floor(assetRandom() * 5);
                fillShape(context, translucent(47, 35, 23, 0.4), [[stainLeft, seamTop + 3], [stainLeft + stainWidth, seamTop + 3], [stainLeft + stainWidth / 2, seamTop + 8 + assetRandom() * 26]]);
            }
            fillBox(context, '#3f2f1f', 0, seamTop, 128, 2);
            fillBox(context, '#8b735b', 0, seamTop + 2, 128, 1);
        }
        for (let notchLeft = 5; notchLeft < 128; notchLeft += 16) {
            fillBox(context, '#4b3b2b', notchLeft - 1, 2, 7, 10);
            fillBox(context, '#8b735b', notchLeft, 3, 5, 6);
            fillBox(context, '#a38b6f', notchLeft, 3, 5, 1);
        }
        paintDrips(context, 64, 17, 64, 50, translucent(91, 99, 71, 0.45), 14);
        paintDrips(context, 64, 77, 64, 45, translucent(159, 91, 43, 0.35), 12);
    }

    // BROWNGRN.
    function paintBrownGreen(context) {
        fillBox(context, '#2b2b2b', 0, 0, 64, 30);
        for (let panelLeft = 4; panelLeft < 64; panelLeft += 16) {
            fillBox(context, '#131313', panelLeft - 1, 7, 10, 15);
            fillBox(context, '#3f472b', panelLeft, 8, 8, 13);
            fillBox(context, '#5b6347', panelLeft + 1, 9, 6, 4);
        }
        fillBox(context, '#13230b', 0, 30, 64, 98);
        paintStreaks(context, 0, 33, 64, 95, 0.25);
        paintDrips(context, 0, 33, 64, 80, translucent(55, 55, 55, 0.5), 40);
        paintDrips(context, 0, 33, 64, 80, translucent(75, 55, 27, 0.45), 14);
        fillBox(context, '#1b1b1b', 0, 28, 64, 2);
        fillBox(context, '#533f1f', 0, 30, 64, 2);
        fillBox(context, '#775f3f', 0, 30, 64, 1);
        fillBox(context, '#131313', 0, 0, 64, 2);
    }

    function paintPanelFrame(context, left, top, width, height) {
        fillBox(context, '#272727', left, top, width, height);
        fillBox(context, '#131313', left, top + height - 1, width, 1);
        fillBox(context, '#131313', left + width - 1, top, 1, height);
        fillBox(context, '#333333', left, top, width, 1);
        fillBox(context, '#333333', left, top, 1, height);
    }

    function paintVent(context, left, top) {
        for (let slat = 0; slat < 6; slat++) {
            fillBox(context, '#0b0b0b', left, top + slat * 2, 18, 1);
        }
    }

    function paintCircuits(context, left, top, width, height) {
        fillBox(context, '#070707', left, top, width, height);
        for (let trace = 0; trace < width * height / 14; trace++) {
            const color = ['#2f6323', '#4b9f3f', '#9b9b9b', '#17330f', '#dfdfdf'][trace % 5];
            const horizontal = assetRandom() < 0.5;
            fillBox(context, color, left + 1 + Math.floor(assetRandom() * (width - 8)), top + 1 + Math.floor(assetRandom() * (height - 8)),
                horizontal ? 2 + Math.floor(assetRandom() * 6) : 1, horizontal ? 1 : 2 + Math.floor(assetRandom() * 6));
        }
        fillBox(context, '#8f8f8f', left + width / 4, top + height / 2, width / 3, height / 5);
        fillBox(context, '#575757', left + width / 4 + 1, top + height / 2 + 1, width / 3 - 2, height / 5 - 2);
    }

    function paintConsoleRow(context, left, top, width) {
        fillBox(context, '#131313', left + 2, top + 2, width - 4, 14);
        for (let block = 0; block * 22 + 20 < width; block++) {
            const blockLeft = left + 5 + block * 22;
            const kind = Math.floor(assetRandom() * 4);
            if (kind === 0) {
                for (let key = 0; key < 12; key++) { fillBox(context, '#6b6b6b', blockLeft + (key % 4) * 3, top + 4 + Math.floor(key / 4) * 3, 2, 2); }
            } else if (kind === 1) {
                fillBox(context, '#00009b', blockLeft, top + 5, 16, 3);
                fillBox(context, '#00009b', blockLeft, top + 10, 16, 3);
            } else if (kind === 2) {
                for (let lamp = 0; lamp < 10; lamp++) { fillBox(context, lamp % 3 === 0 ? '#ff9f43' : '#af5b17', blockLeft + (lamp % 5) * 3, top + 5 + Math.floor(lamp / 5) * 4, 2, 2); }
            } else {
                fillBox(context, '#070707', blockLeft, top + 4, 16, 9);
                fillBox(context, '#37732b', blockLeft + 2, top + 6, 9, 1);
                fillBox(context, '#37732b', blockLeft + 2, top + 9, 12, 1);
            }
        }
    }

    // COMPTALL: dark panels with vents, circuit windows, a hazard plate, a monitor, and console rows.
    function paintComputer(context) {

        paintPanelFrame(context, 160, 32, 32, 32);

        paintPanelFrame(context, 192, 0, 64, 44);

        for (let textRow = 0; textRow < 7; textRow++) {

        }
        fillBox(context, '#00006b', 203, 31, 22, 3);

        fillBox(context, '#000000', 230, 11, 4, 4);
        fillBox(context, '#000000', 236, 11, 4, 4);
        fillBox(context, '#000000', 230, 17, 4, 4);
        fillBox(context, '#000000', 236, 17, 4, 4);
        paintPanelFrame(context, 192, 44, 64, 20);
        paintPanelFrame(context, 0, 64, 64, 64);
        paintCircuits(context, 9, 71, 46, 48);
        paintPanelFrame(context, 64, 64, 64, 64);
        paintPanelFrame(context, 72, 72, 48, 48);
        paintVent(context, 87, 80);
        paintVent(context, 87, 100);
        for (const rowTop of [64, 82]) {

            paintConsoleRow(context, 192, rowTop, 64);
        }
        paintPanelFrame(context, 128, 100, 64, 28);

    }

    // BIGDOOR2: a grey steel door with riveted edges, raised plates, rust, and hazard stripes along the bottom.
    function paintBigDoor(context) {
        fillBox(context, '#636363', 0, 0, 128, 128);
        paintStreaks(context, 0, 0, 128, 128, 0.22);
        fillBox(context, '#4f4f4f', 0, 0, 128, 15);
        for (let detail = 0; detail < 9; detail++) {
            fillBox(context, '#777777', 12 + detail * 9, 4, 5, 8);
            fillBox(context, '#3b3b3b', 12 + detail * 9, 11, 5, 1);
        }
        for (let bar = 0; bar < 3; bar++) { fillBox(context, '#9b0000', 104, 3 + bar * 4, 9, 2); }
        fillBox(context, '#8b8b8b', 0, 15, 128, 1);
        for (const plate of [[14, 22, 30, 78], [50, 22, 28, 40], [84, 22, 30, 78], [50, 68, 28, 32]]) {
            fillBox(context, '#474747', plate[0] + 1, plate[1] + 1, plate[2], plate[3]);
            fillBox(context, '#6f6f6f', plate[0], plate[1], plate[2], plate[3]);
            fillBox(context, '#8b8b8b', plate[0], plate[1], plate[2], 1);
            fillBox(context, '#8b8b8b', plate[0], plate[1], 1, plate[3]);
            paintStreaks(context, plate[0] + 1, plate[1] + 1, plate[2] - 1, plate[3] - 1, 0.2);
        }
        fillBox(context, '#9b0000', 36, 60, 8, 3);
        fillBox(context, '#9b0000', 36, 66, 8, 3);
        fillBox(context, '#7f0000', 28, 70, 6, 12);
        paintDrips(context, 14, 16, 100, 60, translucent(191, 107, 43, 0.5), 9);
        for (const rivetLeft of [4, 122]) {
            fillBox(context, '#4f4f4f', rivetLeft - 2, 16, 6, 96);
            for (let rivetTop = 20; rivetTop < 110; rivetTop += 8) {
                fillBox(context, '#9b9b9b', rivetLeft, rivetTop, 2, 2);
                fillBox(context, '#2f2f2f', rivetLeft + 1, rivetTop + 2, 2, 1);
            }
        }
        fillBox(context, '#3b3b3b', 0, 110, 128, 18);
        fillBox(context, '#777777', 0, 110, 128, 1);
        paintHazard(context, 14, 116, 34, 8);
        paintHazard(context, 80, 116, 34, 8);
        fillBox(context, '#9b0000', 3, 116, 7, 8);

    // DOOR3: a brushed steel door with a handle box.
    function paintDoor(context) {
        const brushed = context.createLinearGradient(0, 0, 64, 0);
        brushed.addColorStop(0, '#4f4f4f');
        brushed.addColorStop(0.3, '#878787');
        brushed.addColorStop(0.7, '#6f6f6f');
        brushed.addColorStop(1, '#434343');
        fillBox(context, brushed, 0, 0, 64, 72);
        paintStreaks(context, 0, 0, 64, 72, 0.2);
        fillBox(context, '#4b4b4b', 8, 6, 46, 1);
        fillBox(context, '#4b4b4b', 8, 6, 1, 56);
        fillBox(context, '#9b9b9b', 8, 62, 46, 1);
        fillBox(context, '#9b9b9b', 54, 6, 1, 57);
        for (let slot = 0; slot < 5; slot++) {
            fillBox(context, '#474747', 14 + slot * 8, 9, 1, 8);
            fillBox(context, '#474747', 14 + slot * 8, 54, 1, 6);
        }
        fillBox(context, '#3b3b3b', 45, 31, 15, 20);
        fillBox(context, '#a3a3a3', 46, 32, 13, 18);
        fillBox(context, '#6b6b6b', 48, 36, 5, 12);
        fillBox(context, '#2f2f2f', 50, 38, 2, 9);
        fillBox(context, '#575757', 0, 66, 64, 1);
        fillBox(context, '#3b3b3b', 0, 70, 64, 2);
    }

    // SUPPORT2: three steel shafts with small recessed plates.
    function paintSupport(context) {
        for (let shaft = 0; shaft < 3; shaft++) {
            const shaftLeft = Math.round(shaft * 64 / 3);
            const shine = context.createLinearGradient(shaftLeft, 0, shaftLeft + 22, 0);
            shine.addColorStop(0, '#434343');
            shine.addColorStop(0.5, '#8b8b8b');
            shine.addColorStop(1, '#434343');
            fillBox(context, shine, shaftLeft, 0, 22, 128);
            for (let plateTop = 6; plateTop < 128; plateTop += 16) {
                fillBox(context, '#4b4b4b', shaftLeft + 7, plateTop, 8, 9);
                fillBox(context, '#777777', shaftLeft + 8, plateTop + 1, 7, 8);
                fillBox(context, '#636363', shaftLeft + 8, plateTop + 1, 6, 7);
            }
        }
        const band = context.createLinearGradient(0, 0, 0, 128);
        band.addColorStop(0, translucent(0, 0, 0, 0));
        band.addColorStop(0.5, translucent(0, 0, 0, 0.45));
        band.addColorStop(1, translucent(0, 0, 0, 0));
        fillBox(context, band, 0, 0, 64, 128);
        paintStreaks(context, 0, 0, 64, 128, 0.12);
    }

    function paintHexFloor(context, baseColor, patchColors, centerColor, seamColor) {
        const HALF_FLAT = 11;
        const HALF_POINT = 21;
        const HALF_HEIGHT = 16;
        const CENTERS = [[40, 16], [40, 48], [40, -16], [40, 80], [8, 0], [8, 32], [8, 64], [72, 0], [72, 32], [72, 64], [-24, 16], [-24, 48]];
        paintMottled(context, FLAT_SIZE, FLAT_SIZE, baseColor, patchColors, 50);
        for (const center of CENTERS) {
            fillOval(context, centerColor, center[0] + (assetRandom() - 0.5) * 6, center[1] + (assetRandom() - 0.5) * 4, 11, 8);
        }
        context.strokeStyle = seamColor;
        context.lineWidth = 1.6;
        for (const center of CENTERS) {
            context.beginPath();
            context.moveTo(center[0] - HALF_FLAT, center[1] - HALF_HEIGHT);
            context.lineTo(center[0] + HALF_FLAT, center[1] - HALF_HEIGHT);
            context.lineTo(center[0] + HALF_POINT, center[1]);
            context.lineTo(center[0] + HALF_FLAT, center[1] + HALF_HEIGHT);
            context.lineTo(center[0] - HALF_FLAT, center[1] + HALF_HEIGHT);
            context.lineTo(center[0] - HALF_POINT, center[1]);
            context.closePath();
            context.stroke();
        }
    }

    // NUKAGE1 to NUKAGE3: dark slime cells divided by bright veins. The cell centers drift between the frames.
    function paintNukage(context, phase) {
        const CELL_COUNT = 16;
        const cellRandom = createRandomGenerator(ASSET_SEED);
        const centers = [];
        for (let cell = 0; cell < CELL_COUNT; cell++) {
            const turn = phase + cell * 1.7;
            centers.push([cellRandom() * FLAT_SIZE + 2.5 * Math.cos(turn), cellRandom() * FLAT_SIZE + 2.5 * Math.sin(turn)]);
        }
        for (let row = 0; row < FLAT_SIZE; row++) {
            for (let column = 0; column < FLAT_SIZE; column++) {
                let nearest = Infinity;
                let second = Infinity;
                for (const center of centers) {
                    const deltaX = Math.abs(column - center[0]) % FLAT_SIZE;
                    const deltaY = Math.abs(row - center[1]) % FLAT_SIZE;
                    const distance = Math.hypot(Math.min(deltaX, FLAT_SIZE - deltaX), Math.min(deltaY, FLAT_SIZE - deltaY));
                    if (distance < nearest) {
                        second = nearest;
                        nearest = distance;
                    } else if (distance < second) {
                        second = distance;
                    }
                }
                const vein = clamp(1 - (second - nearest) / 9, 0, 1);
                const pit = clamp(1 - nearest / 4, 0, 1);
                const glow = vein * vein;
                const core = glow * glow * glow;
                fillBox(context, 'rgb(' + Math.round(19 + 24 * glow + 30 * core - 10 * pit) + ',' + Math.round(35 + 56 * glow + 64 * core - 16 * pit) + ','
                    + Math.round(11 + 20 * glow + 30 * core - 5 * pit) + ')', column, row, 1, 1);
            }
        }
    }

    // SKY1: a pale overcast sky, a hazy grey range, and near-black peaks in front.
    function paintSky(context) {
        const FAR_RANGE = [[18, 128], [22, 70], [40, 30], [58, 20], [86, 18], [104, 30], [112, 44], [124, 128]];
        const HAZE_RANGE = [[160, 128], [170, 62], [186, 44], [200, 46], [212, 66], [216, 128]];
        const NEAR_PEAKS = [
            [[72, 128], [90, 84], [100, 52], [112, 32], [136, 24], [152, 32], [164, 60], [182, 96], [196, 128]],
            [[-44, 128], [-36, 60], [-22, 30], [-2, 26], [10, 40], [24, 70], [40, 104], [52, 128]],
            [[212, 128], [220, 60], [234, 30], [254, 26], [266, 40], [280, 70], [296, 104], [308, 128]]
        ];
        const haze = context.createLinearGradient(0, 0, 0, SKY_HEIGHT);
        haze.addColorStop(0, '#b3b3b3');
        haze.addColorStop(0.6, '#c7c7c7');
        haze.addColorStop(1, '#bbbbbb');
        fillBox(context, haze, 0, 0, SKY_WIDTH, SKY_HEIGHT);
        fillShape(context, '#9f9f9f', HAZE_RANGE);
        fillShape(context, '#6b6b6b', FAR_RANGE);
        fillShape(context, translucent(91, 91, 91, 0.6), [[40, 128], [60, 50], [86, 18], [104, 30], [112, 44], [124, 128]]);
        // The near peaks are drawn on their own layer, so that the rock specks land only on the peaks.
        const peaks = createCanvasContext(SKY_WIDTH, SKY_HEIGHT);
        for (const peak of NEAR_PEAKS) {
            fillShape(peaks, '#1b1b1b', peak);
        }
        peaks.globalCompositeOperation = 'source-atop';
        for (let speck = 0; speck < 1400; speck++) {
            const color = ['#2f2f2f', '#131313', '#232b0f', '#373737'][speck % 4];
            fillBox(peaks, color, Math.floor(assetRandom() * SKY_WIDTH), 24 + Math.floor(assetRandom() * 104), 2, 1);
        }
        context.drawImage(peaks.canvas, 0, 0);
    }

    function createTextures() {
        const nukageFrames = [0, 1, 2].map((frameIndex) => rasterize(FLAT_SIZE, FLAT_SIZE, 5, (context) => paintNukage(context, frameIndex * TWO_PI / 3)));
        return {
            startan: rasterize(128, 128, 7, paintStartan),
            brown: rasterize(128, 128, 7, paintBrown),
            brownGreen: rasterize(64, 128, 5, paintBrownGreen),
            // COMPSPAN.
            panel: rasterize(32, 128, 3, (context) => {

            computer: rasterize(256, 128, 3, paintComputer),
            bigDoor: rasterize(128, BIG_DOOR_FRAME_HEIGHT, 5, paintBigDoor),

                fillBox(context, '#775f4b', 3, 6, 26, 6);
                fillBox(context, '#574333', 0, 13, 32, 3);
            }),
            support: rasterize(64, 128, 4, paintSupport),
            switchOff: rasterize(64, 128, 6, (context) => paintSwitch(context, '#ff0000', '#17330f')),
            switchOn: rasterize(64, 128, 6, (context) => paintSwitch(context, '#5b0000', '#4bef3f')),
            // FLOOR4_8.
            floorHex: rasterize(FLAT_SIZE, FLAT_SIZE, 7, (context) => paintHexFloor(context, '#2b2b2b', ['#232323', '#373737', '#2f2f2f', '#1f2b17'], translucent(87, 87, 87, 0.5), '#1f170b')),
            // FLOOR5_2.
            floorBrown: rasterize(FLAT_SIZE, FLAT_SIZE, 6, (context) => paintHexFloor(context, '#573f1f', ['#5f4323', '#4b371b', '#533f1f'], translucent(119, 79, 43, 0.4), '#33270f')),
            // CEIL3_5.
            ceilPlate: rasterize(FLAT_SIZE, FLAT_SIZE, 4, (context) => {
                fillBox(context, '#373737', 0, 0, 64, 64);
                for (const seamLeft of [16, 46]) {
                    fillBox(context, '#2b2b2b', seamLeft, 0, 2, 64);
                    fillBox(context, '#3f3f3f', seamLeft + 2, 0, 1, 64);
                }
                fillBox(context, '#2b2b2b', 0, 54, 64, 2);
                fillBox(context, '#3f3f3f', 0, 56, 64, 1);
                for (let speck = 0; speck < 30; speck++) {
                    fillBox(context, '#2f2f2f', Math.floor(assetRandom() * 64), Math.floor(assetRandom() * 64), 2, 1);
                }
            }),
            // FLAT20.
            tiles: rasterize(FLAT_SIZE, FLAT_SIZE, 5, (context) => {
                fillBox(context, '#676767', 0, 0, 64, 64);
                for (let tileTop = 0; tileTop < 64; tileTop += 8) {
                    for (let tileLeft = 0; tileLeft < 64; tileLeft += 8) {
                        fillBox(context, '#8b8b8b', tileLeft, tileTop, 8, 1);
                        fillBox(context, '#8b8b8b', tileLeft, tileTop, 1, 8);
                        fillBox(context, '#4f4f4f', tileLeft, tileTop + 7, 8, 1);
                        fillBox(context, '#4f4f4f', tileLeft + 7, tileTop, 1, 8);
                    }
                }
            }),
            // FLOOR7_2.
            rocks: rasterize(FLAT_SIZE, FLAT_SIZE, 8, (context) => paintMottled(context, 64, 64, '#373f27', ['#2f371f', '#3f472b', '#474f33', '#232b0f', '#53573b', '#2f371f'], 90)),
            // FLAT14.
            blueFloor: rasterize(FLAT_SIZE, FLAT_SIZE, 0, (context) => {
                const BLUES = ['#00003b', '#000053', '#00006b', '#000047', '#00002f', '#000053'];
                for (let row = 0; row < FLAT_SIZE; row++) {
                    for (let column = 0; column < FLAT_SIZE; column++) {
                        fillBox(context, BLUES[Math.floor(assetRandom() * BLUES.length)], column, row, 1, 1);
                    }
                }
            }),
            // TLITE6_5.
            redLights: rasterize(FLAT_SIZE, FLAT_SIZE, 4, (context) => {
                fillBox(context, '#171717', 0, 0, 64, 64);
                for (const lightCenter of [[16, 16], [48, 16], [16, 48], [48, 48]]) {
                    const glow = context.createRadialGradient(lightCenter[0], lightCenter[1], 0, lightCenter[0], lightCenter[1], 7);
                    glow.addColorStop(0, '#ff5f5f');
                    glow.addColorStop(0.5, '#cb0000');
                    glow.addColorStop(1, '#5b0000');
                    fillOval(context, glow, lightCenter[0], lightCenter[1], 7, 7);
                }
            }),
            nukage: { width: FLAT_SIZE, height: FLAT_SIZE, pixels: nukageFrames[0].pixels, frames: nukageFrames },
            sky: rasterize(SKY_WIDTH, SKY_HEIGHT, 9, paintSky)
        };
    }

    // ---------------------------------------------------------------- sprites

    // Each painter imitates the shape and colors of the Doom sprite that its comment names.

    const SPRITE_SIZE = 64;
    const SPRITE_CENTER = SPRITE_SIZE / 2;
    const DEATH_FRAMES = [
        { heightFactor: 0.96, widthFactor: 1, bloodDrops: 14 },
        { heightFactor: 0.82, widthFactor: 1, bloodDrops: 22 },
        { heightFactor: 0.62, widthFactor: 1.08, bloodDrops: 22 },
        { heightFactor: 0.46, widthFactor: 1.16, bloodDrops: 16 },
        { heightFactor: 0.3, widthFactor: 1.2, bloodDrops: 10 }
    ];

    // Paints shapes mirrored about the vertical center line of the sprite.
    function flipped(context, paintSide) {
        context.save();
        context.translate(SPRITE_SIZE, 0);
        context.scale(-1, 1);
        paintSide(context);
        context.restore();
    }

    // Paints one side of a symmetric figure, then the same shapes mirrored about the vertical center line.
    function mirrored(context, paintSide) {
        paintSide(context);
        flipped(context, paintSide);
    }

    const RELIEF_BLUR_RADIUS = 2;
    const RELIEF_BLUR_PASSES = 2;
    const RELIEF_CONTRAST = 1.5;
    const RELIEF_GLOW = 45;

    // Paints one body part on its own layer, shades the layer as a rounded solid that is lit from the upper left, and
    // draws the layer onto the sprite. Doom's sprites were photographed from lit clay and latex models, and this
    // shading gives the painted parts that roundness. Inside paint, the parameter is the layer to paint on.
    function paintPart(context, paint) {
        const width = context.canvas.width;
        const height = context.canvas.height;
        const layer = createCanvasContext(width, height);
        layer.setTransform(context.getTransform());
        paint(layer);
        const image = layer.getImageData(0, 0, width, height);
        const colors = image.data;
        // The height of the solid at each pixel is the blurred coverage of the part: low at its edges, high inside.
        let heights = new Float32Array(width * height);
        for (let pixelIndex = 0; pixelIndex < heights.length; pixelIndex++) { heights[pixelIndex] = colors[pixelIndex * 4 + 3] / 255; }
        for (let pass = 0; pass < RELIEF_BLUR_PASSES * 2; pass++) {
            const blurred = new Float32Array(width * height);
            const alongRow = pass % 2 === 0;
            for (let row = 0; row < height; row++) {
                for (let column = 0; column < width; column++) {
                    const position = alongRow ? column : row;
                    const limit = alongRow ? width : height;
                    let sum = 0;
                    for (let offset = -RELIEF_BLUR_RADIUS; offset <= RELIEF_BLUR_RADIUS; offset++) {
                        if (position + offset >= 0 && position + offset < limit) { sum += heights[row * width + column + offset * (alongRow ? 1 : width)]; }
                    }
                    blurred[row * width + column] = sum / (RELIEF_BLUR_RADIUS * 2 + 1);
                }
            }
            heights = blurred;
        }
        const heightAt = (column, row) => column < 0 || row < 0 || column >= width || row >= height ? 0 : heights[row * width + column];
        for (let row = 0; row < height; row++) {
            for (let column = 0; column < width; column++) {
                const colorIndex = (row * width + column) * 4;
                if (colors[colorIndex + 3] === 0) { continue; }
                const light = heightAt(column + 1, row + 1) - heightAt(column - 1, row - 1);
                for (let channel = 0; channel < 3; channel++) {
                    colors[colorIndex + channel] = clamp(Math.round(colors[colorIndex + channel] * (1 + light * RELIEF_CONTRAST) + Math.max(0, light) * RELIEF_GLOW), 0, 255);
                }
            }
        }
        layer.putImageData(image, 0, 0);
        context.save();
        context.resetTransform();
        context.drawImage(layer.canvas, 0, 0);
        context.restore();
    }

    // Lights a finished figure from the upper left, as Doom's sprites are lit.
    function shadeFigure(context) {
        context.globalCompositeOperation = 'source-atop';
        const shading = context.createLinearGradient(12, 0, 52, 24);
        shading.addColorStop(0, translucent(255, 255, 255, 0.08));
        shading.addColorStop(0.45, translucent(0, 0, 0, 0));
        shading.addColorStop(1, translucent(0, 0, 0, 0.3));
        fillBox(context, shading, 0, 0, SPRITE_SIZE, SPRITE_SIZE);
        context.globalCompositeOperation = 'source-over';
    }

    // POSS: the zombieman. A tan shirt with a bloody chest, grey-green trousers, maroon boots, green hair, and a grey rifle.
    function paintZombie(context, pose) {
        const PANTS = '#5b6347';
        const PANTS_DARK = '#373f27';
        const BOOT = '#5b1f1f';
        const SHIRT = '#8f7353';
        const SHIRT_DARK = '#6f5743';
        const SKIN = '#c38f73';
        const FOREARM = '#b78363';
        const GLOVE = '#7f2f2f';
        const BLOOD = '#9b0000';
        const GUN = '#575757';
        const GUN_DARK = '#232323';
        const stride = pose.stride;
        const leftLift = stride > 0 ? 4 : 0;
        const rightLift = stride < 0 ? 4 : 0;
        paintPart(context, (context) => {
        strokeLine(context, PANTS, 9, 27, 41, 25 - stride * 2, 56 - leftLift);
        strokeLine(context, PANTS, 9, 37, 41, 39 + stride * 2, 56 - rightLift);
        strokeLine(context, PANTS_DARK, 2, 30, 43, 29 - stride * 2, 56 - leftLift);
        strokeLine(context, PANTS_DARK, 2, 34, 43, 35 + stride * 2, 56 - rightLift);
        fillOval(context, BLOOD, 25 - stride, 49 - leftLift, 3, 4);
        fillOval(context, BLOOD, 39 + stride, 46 - rightLift, 2.5, 3);
        fillOval(context, BOOT, 24 - stride * 2, 60 - leftLift, 6, 4);
        fillOval(context, BOOT, 40 + stride * 2, 60 - rightLift, 6, 4);
        });
        paintPart(context, (context) => {
        fillShape(context, SHIRT, [[19, 21], [45, 21], [43, 41], [21, 41]]);
        fillOval(context, SHIRT, 18, 25, 6, 5);
        fillOval(context, SHIRT, 46, 25, 6, 5);

            fillShape(context, GUN_DARK, [[44, 26], [55, 22], [56, 24], [45, 28]]);
            fillShape(context, GUN_DARK, [[28, 36], [32, 35], [34, 41], [30, 42]]);

            fillOval(context, GLOVE, 42, 30, 3.5, 3.5);
        } else if (pose.arms === 'aim') {
            strokeLine(context, SHIRT, 7, 17, 26, 18, 33);
            strokeLine(context, FOREARM, 6, 18, 33, 26, 34);
            strokeLine(context, SHIRT, 7, 47, 26, 46, 33);

            fillShape(context, GUN_DARK, [[25, 28], [39, 28], [38, 38], [26, 38]]);
            fillBox(context, GUN, 27, 29, 10, 3);

                fillOval(context, '#ffe74b', 32, 34, 5, 5);

            }
        } else if (pose.arms === 'spread') {
            strokeLine(context, SHIRT, 7, 17, 26, 9, 20);
            strokeLine(context, FOREARM, 6, 9, 20, 6, 13);
            strokeLine(context, SHIRT, 7, 47, 26, 55, 20);
            strokeLine(context, FOREARM, 6, 55, 20, 58, 13);
            strokeLine(context, GUN_DARK, 6, 14, 44, 44, 36);

        } else {

        }
        });
        const headTop = pose.mouthOpen ? 7 : 9;

    // TROO: the imp. A brown, muscular body with red eyes, an open mouth, and pale spikes on the shoulders, elbows, and knees.
    function paintImp(context, pose) {
        const SKIN = '#77532f';
        const LIGHT = '#a36b3f';
        const DARK = '#4b371b';
        const SPIKE = '#cfcfcf';
        const stride = pose.stride;
        const leftLift = stride > 0 ? 4 : 0;
        const rightLift = stride < 0 ? 4 : 0;
        const paintLeg = (context, hipX, kneeX, lift, direction) => {
            strokeLine(context, SKIN, 10, hipX, 41, kneeX, 50 - lift);
            strokeLine(context, SKIN, 7, kneeX, 50 - lift, kneeX + direction, 59 - lift);
            strokeLine(context, LIGHT, 2, hipX - direction, 42, kneeX - direction, 49 - lift);
            fillShape(context, SPIKE, [[kneeX - direction * 3, 49 - lift], [kneeX - direction * 8, 47 - lift], [kneeX - direction * 3, 52 - lift]]);
            fillShape(context, SKIN, [[kneeX - 5, 62 - lift], [kneeX + 6, 62 - lift], [kneeX + 3, 57 - lift], [kneeX - 2, 57 - lift]]);
            fillBox(context, SPIKE, kneeX - 5, 61 - lift, 2, 1);
            fillBox(context, SPIKE, kneeX + 4, 61 - lift, 2, 1);
        };
        paintPart(context, (layer) => paintLeg(layer, 27, 24 - stride * 2, leftLift, -1));
        paintPart(context, (layer) => paintLeg(layer, 37, 40 + stride * 2, rightLift, 1));
        paintPart(context, (context) => {
        fillShape(context, SKIN, [[17, 21], [47, 21], [40, 42], [24, 42]]);
        mirrored(context, () => {
            fillOval(context, SKIN, 17, 24, 7, 6);
            fillOval(context, LIGHT, 26, 27, 5, 4);
            fillShape(context, SPIKE, [[11, 22], [4, 15], [15, 19]]);
            fillShape(context, SPIKE, [[15, 19], [13, 10], [19, 18]]);
        });
        fillBox(context, DARK, 31, 23, 2, 18);
        fillBox(context, DARK, 26, 32, 12, 1);
        fillBox(context, DARK, 27, 36, 10, 1);
        });
        const paintHangingArm = (context) => {
            strokeLine(context, SKIN, 8, 15, 26, 12, 35);
            strokeLine(context, SKIN, 7, 12, 35, 15, 43);
            strokeLine(context, LIGHT, 2, 13, 27, 10, 34);
            fillShape(context, SPIKE, [[9, 35], [3, 33], [9, 38]]);
            fillOval(context, LIGHT, 15, 44, 3.5, 3.5);
        };
        paintPart(context, (context) => {
        if (pose.arms === 'down') {
            mirrored(context, paintHangingArm);
        } else if (pose.arms === 'raise') {
            flipped(context, paintHangingArm);
            strokeLine(context, SKIN, 8, 15, 25, 8, 16);
            strokeLine(context, SKIN, 7, 8, 16, 10, 9);
            fillOval(context, '#b30000', 10, 6, 5.5, 5.5);
            fillOval(context, '#ff7b1b', 10, 6, 3.5, 3.5);
            fillOval(context, '#ffe74b', 9, 5, 1.5, 1.5);
        } else if (pose.arms === 'throw') {
            flipped(context, paintHangingArm);
            strokeLine(context, SKIN, 8, 15, 26, 7, 30);
            strokeLine(context, SKIN, 7, 7, 30, 3, 36);
            strokeLine(context, SPIKE, 1, 3, 36, 0, 40);
            strokeLine(context, SPIKE, 1, 4, 37, 3, 42);
            strokeLine(context, SPIKE, 1, 2, 35, 0, 36);
        } else if (pose.arms === 'spread') {
            mirrored(context, () => {
                strokeLine(context, SKIN, 8, 15, 25, 7, 20);
                strokeLine(context, SKIN, 7, 7, 20, 4, 12);
                fillOval(context, LIGHT, 4, 11, 3.5, 3.5);
            });
        } else {
            throw new Error('Unknown imp arm pose: ' + pose.arms);
        }
        });
        const headTop = pose.arms === 'spread' ? 5 : 7;
        paintPart(context, (context) => {
        fillOval(context, SKIN, 32, headTop + 7, 6.5, 7.5);
        fillOval(context, LIGHT, 32, headTop + 3, 5, 2.5);
        fillBox(context, DARK, 27, headTop + 5, 10, 1);
        fillBox(context, '#ff0000', 28, headTop + 6, 3, 2);
        fillBox(context, '#ff0000', 33, headTop + 6, 3, 2);
        fillOval(context, '#3f0000', 32, headTop + 11, 3.5, 3);
        fillBox(context, '#efefef', 30, headTop + 9, 5, 1);
        fillBox(context, '#efefef', 30, headTop + 13, 5, 1);
        fillBox(context, '#cb0000', 31, headTop + 11, 3, 1);
        });
        shadeFigure(context);
    }

    function deathSprites(paintFigure) {
        const source = createCanvasContext(SPRITE_SIZE, SPRITE_SIZE);
        paintFigure(source, { stride: 0, arms: 'spread', mouthOpen: true, flash: false });
        return DEATH_FRAMES.map((frame) => rasterize(SPRITE_SIZE, SPRITE_SIZE, 8, (context) => {
            const height = Math.round(SPRITE_SIZE * frame.heightFactor);
            const width = Math.round(SPRITE_SIZE * frame.widthFactor);
            context.imageSmoothingEnabled = false;
            context.drawImage(source.canvas, 0, 0, SPRITE_SIZE, SPRITE_SIZE, SPRITE_CENTER - width / 2, SPRITE_SIZE - height, width, height);
            const chestY = SPRITE_SIZE - height * 0.55;
            fillOval(context, '#7f0000', SPRITE_CENTER, chestY, 7, 5 * frame.heightFactor + 2);
            fillOval(context, '#d70000', SPRITE_CENTER - 1, chestY, 3, 3);
            for (let drop = 0; drop < frame.bloodDrops; drop++) {
                const turn = assetRandom() * TWO_PI;
                const reach = 4 + assetRandom() * 16;
                fillBox(context, drop % 2 === 0 ? '#cb0000' : '#8b0000', SPRITE_CENTER + Math.cos(turn) * reach, chestY + Math.sin(turn) * reach * frame.heightFactor, 2, 2);
            }
        }));
    }

    // BAL1 A and B: the imp fireball.
    function fireballSprite(coreShift) {
        return rasterize(16, 16, 8, (context) => {
            fillOval(context, '#8b0000', 8, 8, 7.5, 7.5);
            fillOval(context, '#d70000', 8, 8, 6, 6);
            fillOval(context, '#ff7b1b', 7 + coreShift, 7.5, 3.5, 3);
            fillOval(context, '#ffe74b', 6.5 + coreShift, 7, 1.8, 1.5);
        });
    }

    // BAL1 C to E: the fireball bursts into a growing ring of red smoke.
    function explosionSprite(radius, sparse) {
        const size = 52;
        return rasterize(size, size, 10, (context) => {
            const blobCount = sparse ? 46 : 10;
            for (let blob = 0; blob < blobCount; blob++) {
                const turn = TWO_PI * blob / blobCount + assetRandom();
                const reach = radius * (sparse ? 0.55 + assetRandom() * 0.45 : 0.6);
                const blobRadius = sparse ? 1.5 + assetRandom() * 2 : radius * 0.45;
                fillOval(context, blob % 3 === 0 ? '#a70000' : '#730000', size / 2 + Math.cos(turn) * reach, size / 2 + Math.sin(turn) * reach * 0.9, blobRadius, blobRadius);
            }
            if (!sparse) {
                for (let blob = 0; blob < 7; blob++) {
                    const turn = TWO_PI * blob / 7 + 0.4;
                    fillOval(context, '#bf0000', size / 2 + Math.cos(turn) * radius * 0.55, size / 2 + Math.sin(turn) * radius * 0.5, radius * 0.22, radius * 0.2);
                }
                context.globalCompositeOperation = 'destination-out';
                fillOval(context, '#000000', size / 2 + 1, size / 2 + 1, radius * 0.2, radius * 0.18);
                context.globalCompositeOperation = 'source-over';
            }
        });
    }

    // PUFF A to D: a bullet puff starts as an orange spark and opens into a grey smoke ring.
    function puffSprite(radius, sparkColor, ringColor) {
        return rasterize(16, 16, 8, (context) => {
            if (radius < 3.5) {
                fillOval(context, ringColor, 8, 8, radius, radius);
                fillOval(context, sparkColor, 8, 8, radius * 0.6, radius * 0.6);
                return;
            }
            for (let dot = 0; dot < 14; dot++) {
                const turn = TWO_PI * dot / 14;
                fillBox(context, ringColor, 8 + Math.cos(turn) * radius - 0.5, 8 + Math.sin(turn) * radius - 0.5, 1.6, 1.6);
            }
            fillBox(context, ringColor, 6, 7, 2, 1);
            fillBox(context, ringColor, 9, 9, 2, 1);
        });
    }

    // BLUD A to C: a blood splat.
    function bloodSprite(radius) {
        return rasterize(12, 12, 8, (context) => {
            for (let spike = 0; spike < 9; spike++) {
                const turn = TWO_PI * spike / 9 + assetRandom() * 0.5;
                const reach = radius * (0.6 + assetRandom() * 0.5);
                strokeLine(context, '#b30000', 1.3, 6, 6, 6 + Math.cos(turn) * reach, 6 + Math.sin(turn) * reach);
            }
            fillOval(context, '#cb0000', 6, 6, radius * 0.55, radius * 0.55);
            fillOval(context, '#5b0000', 6, 6, radius * 0.25, radius * 0.25);
        });
    }

    // ARM1: the green armor vest.

    // PISG: the pistol, seen from behind in the player's fist. Firing frames move the pistol up and toward the viewer.
    function paintPistol(context, raise, growth) {

        for (let stud = 0; stud < 6; stud++) { fillBox(context, '#6f6f6f', 23 + stud * 4, 33, 2, 2); }
        });

    // PISF: the pistol's muzzle flash, a red flame with a pale chevron core.
    function paintPistolFlash(context) {
        fillShape(context, '#ef0000', [[21, 0], [26, 11], [33, 8], [32, 18], [41, 24], [35, 30], [37, 38], [5, 38], [7, 30], [1, 24], [10, 18], [9, 8], [16, 11]]);

    // STF: the marine's face on the status bar.
    function paintFace(context, bloodLevel, lookOffset, expression) {
        const BLOOD_MARKS = [[10, 19, 2, 4], [5, 7, 2, 5], [17, 6, 2, 7], [13, 20, 3, 5], [6, 17, 2, 6], [11, 25, 3, 3], [3, 12, 2, 5], [19, 14, 2, 6], [8, 3, 2, 4], [15, 9, 2, 4]];
        const HAIR = '#5f4323';
        const HAIR_DARK = '#33270f';
        const SKIN = expression === 'dead' ? '#8f6f5b' : '#b37347';
        const SKIN_LIGHT = expression === 'dead' ? '#ab8b77' : '#d78b5b';
        const SKIN_DARK = '#875733';
        const SHADE = '#6b4727';
        fillShape(context, SKIN, [[3, 6], [20, 6], [22, 10], [22, 19], [20, 24], [16, 29], [8, 29], [4, 24], [2, 19], [2, 10]]);
        fillBox(context, SKIN_DARK, 0, 11, 2, 6);
        fillBox(context, SKIN_DARK, 22, 11, 2, 6);
        fillShape(context, HAIR, [[2, 11], [2, 4], [5, 1], [11, 0], [18, 1], [22, 4], [22, 11], [19, 7], [15, 6], [12, 7], [8, 6], [4, 7]]);
        fillShape(context, '#7b5b33', [[6, 2], [11, 1], [17, 2], [15, 4], [8, 4]]);
        fillBox(context, SKIN_LIGHT, 6, 8, 12, 2);
        fillBox(context, SKIN_DARK, 2, 11, 2, 10);
        fillBox(context, SKIN_DARK, 20, 11, 2, 10);
        fillBox(context, HAIR_DARK, 4, 10, 7, 2);
        fillBox(context, HAIR_DARK, 13, 10, 7, 2);
        fillBox(context, HAIR_DARK, 9, 12, 2, 1);
        fillBox(context, HAIR_DARK, 13, 12, 2, 1);
        fillBox(context, SHADE, 4, 12, 6, 3);
        fillBox(context, SHADE, 14, 12, 6, 3);
        if (expression === 'dead') {
            fillBox(context, HAIR_DARK, 5, 14, 5, 1);
            fillBox(context, HAIR_DARK, 14, 14, 5, 1);
        } else {
            const eyeTop = expression === 'ouch' ? 12 : 13;
            fillBox(context, '#efefef', 5, eyeTop, 5, 15 - eyeTop);
            fillBox(context, '#efefef', 14, eyeTop, 5, 15 - eyeTop);
            fillBox(context, '#1b1b1b', 7 + lookOffset, eyeTop, 2, 15 - eyeTop);
            fillBox(context, '#1b1b1b', 15 + lookOffset, eyeTop, 2, 15 - eyeTop);
        }
        fillBox(context, SKIN_LIGHT, 11, 12, 2, 7);
        fillBox(context, SKIN_LIGHT, 5, 16, 4, 3);
        fillBox(context, SKIN_LIGHT, 15, 16, 4, 3);
        fillBox(context, SHADE, 10, 19, 4, 1);
        fillBox(context, SKIN_DARK, 9, 18, 1, 1);
        fillBox(context, SKIN_DARK, 14, 18, 1, 1);

            fillBox(context, '#2b0b0b', 8, 20, 8, 6);
            fillBox(context, '#efefef', 9, 20, 6, 1);
            fillBox(context, '#9b0000', 10, 24, 4, 1);
        } else {
            fillBox(context, HAIR_DARK, 8, 22, 8, 1);
            fillBox(context, SKIN_DARK, 9, 23, 6, 1);
        }
        fillBox(context, SKIN_LIGHT, 9, 26, 6, 2);
        fillBox(context, SKIN_DARK, 5, 25, 2, 2);

        const markCount = expression === 'dead' ? BLOOD_MARKS.length : bloodLevel * 2;
        for (let markIndex = 0; markIndex < markCount; markIndex++) {
            const mark = BLOOD_MARKS[markIndex];
            fillBox(context, markIndex % 2 === 0 ? '#af0000' : '#7f0000', mark[0], mark[1], mark[2], mark[3]);
        }
    }

    function createSprites() {
        const figure = (paintFigure, stride, arms, mouthOpen, flash) =>
            rasterize(SPRITE_SIZE, SPRITE_SIZE, 8, (context) => paintFigure(context, { stride: stride, arms: arms, mouthOpen: mouthOpen, flash: flash }));
        const faceSprite = (bloodLevel, lookOffset, expression) => rasterize(24, 29, 5, (context) => paintFace(context, bloodLevel, lookOffset, expression));
        const bloodLevels = Array.from({ length: FACE_BLOOD_LEVELS }, (unused, bloodLevel) => bloodLevel);
        return {
            zombie: {
                walk: [figure(paintZombie, 1, 'hold', false, false), figure(paintZombie, -1, 'hold', false, false)],
                aim: figure(paintZombie, 0, 'aim', false, false),
                fire: figure(paintZombie, 0, 'aim', false, true),
                pain: figure(paintZombie, 0, 'spread', true, false),
                die: deathSprites(paintZombie)
            },
            imp: {
                walk: [figure(paintImp, 1, 'down', false, false), figure(paintImp, -1, 'down', false, false)],
                raise: figure(paintImp, 0, 'raise', true, false),
                throw: figure(paintImp, 0, 'throw', true, false),
                pain: figure(paintImp, 0, 'spread', true, false),
                die: deathSprites(paintImp)
            },
            fireball: [fireballSprite(0), fireballSprite(2)],
            explosion: [explosionSprite(15, false), explosionSprite(20, false), explosionSprite(24, true)],
            puff: [puffSprite(2, '#ffc74b', '#d75f0b'), puffSprite(3.2, '#c79b6b', '#8f6f4f'), puffSprite(5, '#000000', '#777777'), puffSprite(7, '#000000', '#5b5b5b')],
            blood: [bloodSprite(5.5), bloodSprite(4), bloodSprite(2.5)],
            // STIM.
            stimpack: [rasterize(14, 15, 5, (context) => {
                fillShape(context, '#ababab', [[2, 1], [12, 1], [14, 4], [0, 4]]);
                fillBox(context, '#6b6b6b', 0, 4, 14, 10);
                fillBox(context, '#939393', 0, 4, 14, 1);
                fillBox(context, '#5b472b', 0, 13, 14, 2);
                fillBox(context, '#dfdfdf', 6, 2, 2, 1);
                fillBox(context, '#cb0000', 6, 6, 2, 6);
                fillBox(context, '#cb0000', 4, 8, 6, 2);
            })],
            // CLIP.
            clip: [rasterize(9, 11, 4, (context) => {
                fillBox(context, '#232323', 0, 1, 9, 10);
                fillBox(context, '#373737', 1, 2, 7, 8);
                fillBox(context, '#131313', 3, 2, 1, 8);
                fillBox(context, '#131313', 5, 2, 1, 8);
                fillBox(context, '#575757', 1, 2, 1, 8);
                fillBox(context, '#874307', 1, 0, 7, 1);
            })],
            armor: [rasterize(31, 17, 5, (context) => paintArmor(context, false)), rasterize(31, 17, 5, (context) => paintArmor(context, true))],
            pistol: [[0, 1], [5, 1.14], [3, 1.07]].map((frame) => rasterize(SPRITE_SIZE, SPRITE_SIZE, 6, (context) => paintPistol(context, frame[0], frame[1]))),
            pistolFlash: rasterize(42, 38, 6, paintPistolFlash),
            faces: bloodLevels.map((bloodLevel) => [-1, 0, 1].map((lookOffset) => faceSprite(bloodLevel, lookOffset, 'normal'))),

    const GLYPH_COLUMNS = 5;

        '2': '01110 10001 00001 00010 00100 01000 11111', '3': '11110 00001 00001 01110 00001 00001 11110',
        '4': '00010 00110 01010 10010 11111 00010 00010', '5': '11111 10000 11110 00001 00001 10001 01110',
        '6': '00110 01000 10000 11110 10001 10001 01110', '7': '11111 00001 00010 00100 01000 01000 01000',
        '8': '01110 10001 10001 01110 10001 10001 01110', '9': '01110 10001 10001 01111 00001 00010 01100',

    // Builds one sprite per glyph. scale is the size of one glyph cell in pixels. The glyph color runs from topColor
    // to bottomColor, and each glyph casts a one-pixel shadow down and to the right.
    function createFont(scale, topColor, bottomColor, shadowColor) {
        const shadowIndex = nearestPaletteIndex(shadowColor[0], shadowColor[1], shadowColor[2]);
        const font = new Map();
        font.set(' ', { width: 1, height: 1, pixels: new Uint8Array(1), advance: SPACE_ADVANCE * scale });
        for (const character of Object.keys(GLYPHS)) {
            const bits = GLYPHS[character].replace(/ /g, '');
            const litCell = (column, row) => (column < GLYPH_COLUMNS && bits[row * GLYPH_COLUMNS + column] === '1')
                || (column > 0 && bits[row * GLYPH_COLUMNS + column - 1] === '1');
            let firstColumn = GLYPH_COLUMNS;
            let lastColumn = 0;
            for (let row = 0; row < GLYPH_ROWS; row++) {
                for (let column = 0; column <= GLYPH_COLUMNS; column++) {
                    if (litCell(column, row)) {
                        firstColumn = Math.min(firstColumn, column);
                        lastColumn = Math.max(lastColumn, column);
                    }
                }
            }
            const bodyWidth = (lastColumn - firstColumn + 1) * scale;
            const bodyHeight = GLYPH_ROWS * scale;
            const width = bodyWidth + 1;
            const height = bodyHeight + 1;
            const pixels = new Uint8Array(width * height);
            for (let pixelRow = 0; pixelRow < bodyHeight; pixelRow++) {
                const blend = pixelRow / (bodyHeight - 1);
                const colorIndex = nearestPaletteIndex(
                    Math.round(topColor[0] + (bottomColor[0] - topColor[0]) * blend),
                    Math.round(topColor[1] + (bottomColor[1] - topColor[1]) * blend),
                    Math.round(topColor[2] + (bottomColor[2] - topColor[2]) * blend));
                for (let pixelColumn = 0; pixelColumn < bodyWidth; pixelColumn++) {
                    if (!litCell(firstColumn + Math.floor(pixelColumn / scale), Math.floor(pixelRow / scale))) { continue; }
                    pixels[pixelRow * width + pixelColumn] = colorIndex;
                    const shadowPixel = (pixelRow + 1) * width + pixelColumn + 1;
                    if (pixels[shadowPixel] === TRANSPARENT_INDEX) { pixels[shadowPixel] = shadowIndex; }
                }
            }
            font.set(character, { width: width, height: height, pixels: pixels, advance: bodyWidth + scale });
        }
        return font;
    }

    // Calls plot(column, row) for each lit pixel of text drawn in the tiny font, with its left edge at leftColumn.

    function polygonArea(points) {
        let doubledArea = 0;
        for (let pointIndex = 0; pointIndex < points.length; pointIndex++) {
            const current = points[pointIndex];
            const next = points[(pointIndex + 1) % points.length];
            doubledArea += current[0] * next[1] - next[0] * current[1];
        }
        return doubledArea / 2;
    }

    function pointInPolygon(pointX, pointY, points) {
        let inside = false;
        for (let pointIndex = 0, previousIndex = points.length - 1; pointIndex < points.length; previousIndex = pointIndex++) {
            const current = points[pointIndex];
            const previous = points[previousIndex];
            if ((current[1] > pointY) !== (previous[1] > pointY)
                && pointX < (previous[0] - current[0]) * (pointY - current[1]) / (previous[1] - current[1]) + current[0]) {
                inside = !inside;
            }
        }
        return inside;
    }

    function textureNamed(textureName) {
        const texture = textures[textureName];
        if (texture === undefined) { throw new Error('The level names an unknown texture: ' + textureName); }
        return texture;

    function buildLevelGeometry() {
        sectors = SECTOR_DEFINITIONS.map((definition) => {
            const area = polygonArea(definition.points);
            if (area <= 0) { throw new Error('Sector ' + definition.name + ' does not list its points counter-clockwise.'); }
            let centerX = 0;
            let centerY = 0;
            for (const point of definition.points) {
                centerX += point[0] / definition.points.length;
                centerY += point[1] / definition.points.length;
            }
            return {
                name: definition.name, points: definition.points, area: area, centerX: centerX, centerY: centerY,
                floor: definition.floor, ceil: definition.ceil, light: definition.light, baseLight: definition.light,
                floorFlat: textureNamed(definition.floorFlat),
                ceilFlat: definition.ceilFlat === SKY_FLAT ? null : textureNamed(definition.ceilFlat),
                side: textureNamed(definition.side),
                damage: definition.features.damage, flicker: definition.features.flicker,
                door: definition.features.door === null ? null : { state: 'closed', timer: 0, top: definition.floor + definition.features.door.openHeight },
                lines: [], neighbors: []
            };
        });
        doorSectors = sectors.filter((sector) => sector.door !== null);

        const allPoints = [];
        for (const definition of SECTOR_DEFINITIONS) {
            for (const point of definition.points) { allPoints.push(point); }
        }

        // Split every polygon edge at each vertex of any sector that lies on the edge, so that shared edges match exactly.
        const pieces = [];
        const piecesByKey = new Map();
        SECTOR_DEFINITIONS.forEach((definition, sectorIndex) => {
            definition.points.forEach((start, edgeIndex) => {
                const end = definition.points[(edgeIndex + 1) % definition.points.length];
                const edgeX = end[0] - start[0];
                const edgeY = end[1] - start[1];
                const edgeLengthSquared = edgeX * edgeX + edgeY * edgeY;
                const stops = new Map([[0, start], [edgeLengthSquared, end]]);
                for (const point of allPoints) {
                    const offsetX = point[0] - start[0];
                    const offsetY = point[1] - start[1];
                    if (offsetX * edgeY - offsetY * edgeX !== 0) { continue; }
                    const along = offsetX * edgeX + offsetY * edgeY;
                    if (along > 0 && along < edgeLengthSquared) { stops.set(along, point); }
                }
                const ordered = Array.from(stops.keys()).sort((first, second) => first - second);

                for (let stopIndex = 0; stopIndex + 1 < ordered.length; stopIndex++) {
                    const pieceStart = stops.get(ordered[stopIndex]);
                    const pieceEnd = stops.get(ordered[stopIndex + 1]);
                    const piece = {
                        startX: pieceStart[0], startY: pieceStart[1], endX: pieceEnd[0], endY: pieceEnd[1],
                        sector: sectors[sectorIndex], textureName: textureName, pegBottom: definition.features.pegBottom,
                        // Wall textures run left to right for a viewer inside the sector, which is from the end of the edge to its start.
                        textureOffset: (edgeLengthSquared - ordered[stopIndex + 1]) / Math.sqrt(edgeLengthSquared), used: false
                    };
                    const key = piece.startX + ',' + piece.startY + ',' + piece.endX + ',' + piece.endY;
                    if (piecesByKey.has(key)) { throw new Error('Sectors ' + piecesByKey.get(key).sector.name + ' and ' + definition.name + ' overlap along edge ' + key + '.'); }

            const deltaX = piece.endX - piece.startX;
            const deltaY = piece.endY - piece.startY;
            const length = Math.hypot(deltaX, deltaY);
            let back = null;
            const reverse = piecesByKey.get(piece.endX + ',' + piece.endY + ',' + piece.startX + ',' + piece.startY);
            if (reverse !== undefined) {

                const outsideY = (piece.startY + piece.endY) / 2 - deltaX / length;

                    }

                ax: piece.startX, ay: piece.startY, dx: deltaX, dy: deltaY, length: length,

    // ---------------------------------------------------------------- ray and geometry queries

    // Finds every line that a ray crosses and stores the crossings sorted by distance in the hit arrays.
    function collectHits(originX, originY, directionX, directionY) {
        hitCount = 0;
        for (let lineIndex = 0; lineIndex < lines.length; lineIndex++) {
            const line = lines[lineIndex];
            const denominator = directionX * line.dy - directionY * line.dx;
            if (denominator === 0) { continue; }
            const relativeX = line.ax - originX;
            const relativeY = line.ay - originY;
            const sideValue = relativeX * line.dy - relativeY * line.dx;
            const rayParam = sideValue / denominator;
            if (rayParam <= MIN_RAY_PARAM) { continue; }
            const lineParam = (relativeX * directionY - relativeY * directionX) / denominator;
            if (lineParam < 0 || lineParam > 1) { continue; }
            if (hitCount === MAX_HITS) { throw new Error('A ray crossed more than ' + MAX_HITS + ' lines.'); }
            let slot = hitCount;
            while (slot > 0 && hitParams[slot - 1] > rayParam) {
                hitParams[slot] = hitParams[slot - 1];
                hitLineParams[slot] = hitLineParams[slot - 1];
                hitOnFront[slot] = hitOnFront[slot - 1];
                hitLines[slot] = hitLines[slot - 1];
                slot--;
            }
            hitParams[slot] = rayParam;
            hitLineParams[slot] = lineParam;
            hitOnFront[slot] = sideValue > 0 ? 1 : 0;
            hitLines[slot] = line;
            hitCount++;
        }
    }

    const PROBE_DIRECTION_X = Math.cos(0.7);
    const PROBE_DIRECTION_Y = Math.sin(0.7);

    // Returns the sector that contains a point, or null for a point outside the level.
    function sectorAt(pointX, pointY) {
        let nearestParam = Infinity;
        let nearestSector = null;
        for (let lineIndex = 0; lineIndex < lines.length; lineIndex++) {
            const line = lines[lineIndex];
            const denominator = PROBE_DIRECTION_X * line.dy - PROBE_DIRECTION_Y * line.dx;
            if (denominator === 0) { continue; }
            const relativeX = line.ax - pointX;
            const relativeY = line.ay - pointY;
            const sideValue = relativeX * line.dy - relativeY * line.dx;
            const rayParam = sideValue / denominator;
            if (rayParam <= 0 || rayParam >= nearestParam) { continue; }
            const lineParam = (relativeX * PROBE_DIRECTION_Y - relativeY * PROBE_DIRECTION_X) / denominator;
            if (lineParam < 0 || lineParam > 1) { continue; }
            nearestParam = rayParam;
            nearestSector = sideValue > 0 ? line.front : line.back;
        }
        return nearestSector;
    }

    function distanceToLine(pointX, pointY, line) {
        const along = clamp(((pointX - line.ax) * line.dx + (pointY - line.ay) * line.dy) / (line.length * line.length), 0, 1);
        return Math.hypot(pointX - (line.ax + line.dx * along), pointY - (line.ay + line.dy * along));
    }

    // The opening of a two-sided line spans from openingBottom(line) up to openingTop(line).
    function openingTop(line) { return Math.min(line.front.ceil, line.back.ceil); }
    function openingBottom(line) { return Math.max(line.front.floor, line.back.floor); }

    // Calls visit(line, fraction) for each line that the segment crosses. Stops and returns true when visit returns true.
    function someCrossedLine(fromX, fromY, toX, toY, visit) {
        const deltaX = toX - fromX;
        const deltaY = toY - fromY;
        for (let lineIndex = 0; lineIndex < lines.length; lineIndex++) {
            const line = lines[lineIndex];
            const denominator = deltaX * line.dy - deltaY * line.dx;
            if (denominator === 0) { continue; }
            const relativeX = line.ax - fromX;
            const relativeY = line.ay - fromY;
            const fraction = (relativeX * line.dy - relativeY * line.dx) / denominator;
            if (fraction <= 0 || fraction >= 1) { continue; }
            const lineParam = (relativeX * deltaY - relativeY * deltaX) / denominator;
            if (lineParam < 0 || lineParam > 1) { continue; }
            if (visit(line, fraction)) { return true; }
        }
        return false;
    }

    function canSee(fromX, fromY, fromZ, target) {
        const distance = Math.hypot(target.x - fromX, target.y - fromY);
        if (distance === 0) { return true; }
        let topSlope = (target.z + target.height - fromZ) / distance;
        let bottomSlope = (target.z - fromZ) / distance;
        return !someCrossedLine(fromX, fromY, target.x, target.y, (line, fraction) => {
            if (line.back === null) { return true; }
            const openTop = openingTop(line);
            const openBottom = openingBottom(line);
            if (openTop <= openBottom) { return true; }
            const crossDistance = fraction * distance;
            if (line.front.floor !== line.back.floor) { bottomSlope = Math.max(bottomSlope, (openBottom - fromZ) / crossDistance); }
            if (line.front.ceil !== line.back.ceil) { topSlope = Math.min(topSlope, (openTop - fromZ) / crossDistance); }
            return topSlope <= bottomSlope;
        });
    }

    // ---------------------------------------------------------------- movement

    function overlapsThing(thing, other, targetX, targetY) {
        const reach = thing.radius + other.radius;
        if (Math.abs(targetX - other.x) >= reach || Math.abs(targetY - other.y) >= reach) { return false; }
        return !(Math.abs(thing.x - other.x) < reach && Math.abs(thing.y - other.y) < reach);

    function checkPosition(thing, targetX, targetY) {
        const result = { blocked: false, blockingLine: null, floorZ: 0, ceilZ: 0, sector: sectorAt(targetX, targetY) };
        if (result.sector === null) {
            result.blocked = true;
            return result;
        }
        result.floorZ = result.sector.floor;
        result.ceilZ = result.sector.ceil;
        let nearestBlockDistance = Infinity;
        for (let lineIndex = 0; lineIndex < lines.length; lineIndex++) {
            const line = lines[lineIndex];
            const distance = distanceToLine(targetX, targetY, line);
            if (distance >= thing.radius) { continue; }
            let lineBlocks = line.back === null;
            if (!lineBlocks) {
                const openTop = openingTop(line);
                const openBottom = openingBottom(line);
                const lowFloor = Math.min(line.front.floor, line.back.floor);
                lineBlocks = openTop - openBottom < thing.height
                    || openBottom - thing.z > MAX_STEP_HEIGHT
                    || openTop - thing.z < thing.height
                    || openBottom - lowFloor > thing.maxDropHeight;
                if (!lineBlocks) {
                    result.floorZ = Math.max(result.floorZ, openBottom);
                    result.ceilZ = Math.min(result.ceilZ, openTop);
                }

            if (lineBlocks && distance < nearestBlockDistance) {

                result.blocked = true;
                result.blockingLine = line;
            }

        if (result.floorZ - thing.z > MAX_STEP_HEIGHT || result.ceilZ - result.floorZ < thing.height) { result.blocked = true; }

        const result = checkPosition(thing, targetX, targetY);

            thing.y = targetY;

        const moveX = thing.momentumX;

            return;

            return;

        thing.momentumY = 0;
